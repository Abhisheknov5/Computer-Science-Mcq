<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Database MCQ Practice</title><style>
body{font-family:Arial,sans-serif;background:#f3f4f6;margin:0;color:#1f2937}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#fff;padding:24px;border-radius:14px;box-shadow:0 2px 10px #0001;margin-bottom:16px}
.option{display:block;width:100%;text-align:left;padding:14px;margin:10px 0;background:white;border:1px solid #d1d5db;border-radius:9px;font-size:16px;cursor:pointer}.selected{border:2px solid #2563eb;background:#eff6ff}
button{padding:11px 16px;border:0;border-radius:8px;cursor:pointer;font-size:16px;margin:4px}.primary{background:#2563eb;color:white}.secondary{background:#e5e7eb}.hidden{display:none}.top{display:flex;justify-content:space-between;flex-wrap:wrap}.correct{background:#dcfce7;border-color:#16a34a}.wrong{background:#fee2e2;border-color:#dc2626}.explain{margin-top:14px;padding:14px;background:#f8fafc;border-radius:8px;line-height:1.5}#palette button{min-width:42px}.done{background:#bbf7d0}
</style></head><body><div class="wrap">
<div id="quiz"><div class="card top"><b id="progress"></b><b>Topic: Database</b></div>
<div class="card"><h2 id="question"></h2><div id="options"></div><div id="explanation" class="hidden explain"></div></div>
<div class="card top"><div><button class="secondary" onclick="prev()">Previous</button><button class="primary" onclick="next()">Next</button></div><button onclick="finish()">Submit Test</button></div><div id="palette" class="card"></div></div>
<div id="result" class="card hidden"><h1>🎯 Result</h1><h2 id="score"></h2><p id="stats"></p><button class="primary" onclick="review()">Review Answers & Explanations</button><button class="secondary" onclick="location.reload()">Try Again</button></div>
</div><script>
const qs=[{"id": 1, "question": "What is a database?", "options": ["A collection of files", "A single spreadsheet", "A collection of inter-related data", "More than one of the above", "None of the above"], "answer": "c", "explanation": "A database is an organized collection of logically connected data, which can be easily retrieved, inserted, and managed."}, {"id": 2, "question": "Which of the following is a common operation in a database?", "options": ["Insert", "Paint", "Draw", "Sketch", "None of the above"], "answer": "a", "explanation": "\"Insert\" is a core operation used to add new data into a table. It is part of CRUD operations (Create, Read, Update, Delete)."}, {"id": 3, "question": "Which format is commonly used to organize data in a database?", "options": ["PDF", "Images", "Tables, schema, views, etc.", "Audio files", "None of the above"], "answer": "c", "explanation": "Databases organize data using tables, schemas, views, and other structured formats for efficient access."}, {"id": 4, "question": "What is one key advantage of using a database?", "options": ["Data duplication", "Slow processing", "Efficient data manipulation", "Insecure storage", "None of the above"], "answer": "c", "explanation": "Databases allow operations such as insert, update, delete, and retrieve data efficiently."}, {"id": 5, "question": "A college database may include information about which of the following?", "options": ["Students", "Faculty", "Admin", "More than one of the above", "None of the above"], "answer": "d", "explanation": "A college database can store inter-related information about students, faculty, admin, and staff."}, {"id": 6, "question": "Which operation is used to add new information to a database?", "options": ["Delete", "Retrieve", "Insert", "Hide", "None of the above"], "answer": "c", "explanation": "The \"Insert\" command is used to add new rows (records) into a database table."}, {"id": 7, "question": "What does the delete operation do in a database?", "options": ["Modifies data", "Removes data", "Adds new tables", "Hides tables", "None of the above"], "answer": "b", "explanation": "The Delete operation is used to remove one or more records from a database table."}, {"id": 8, "question": "What does the term “inter-related data” imply?", "options": ["Data stored in isolation", "Data that is connected", "Random entries", "Deleted data", "None of the above"], "answer": "b", "explanation": "Inter-related data refers to data that is connected through relationships, forming meaningful associations."}, {"id": 9, "question": "Which database component is used to generate structured output or summaries?", "options": ["Reports", "Cursor", "Table", "Trigger", "None of the above"], "answer": "a", "explanation": "Reports are used to extract and present data in a summarized, printable, and readable format."}, {"id": 10, "question": "Why are tables important in a database?", "options": ["They format web pages", "They store data in rows and columns", "They print documents", "They create animations", "None of the above"], "answer": "b", "explanation": "Tables are a basic database structure where data is stored in rows (records) and columns (fields/attributes)."}];let idx=0,ans={},reviewMode=false;
function render(){let q=qs[idx];document.getElementById('progress').textContent=`Question ${idx+1} of ${qs.length}`;document.getElementById('question').textContent=q.question;let box=document.getElementById('options');box.innerHTML='';
q.options.forEach((o,i)=>{let l='abcde'[i],b=document.createElement('button');b.className='option'+(ans[q.id]===l?' selected':'');b.textContent=l.toUpperCase()+') '+o;if(reviewMode){b.disabled=true;if(l===q.answer)b.classList.add('correct');if(ans[q.id]===l&&l!==q.answer)b.classList.add('wrong')}else b.onclick=()=>{ans[q.id]=l;render()};box.appendChild(b)});
let ex=document.getElementById('explanation');if(reviewMode){ex.classList.remove('hidden');ex.innerHTML='<b>Correct Answer: '+q.answer.toUpperCase()+') '+q.options['abcde'.indexOf(q.answer)]+'</b><br><br><b>Explanation:</b> '+q.explanation}else ex.classList.add('hidden');
let p=document.getElementById('palette');p.innerHTML='<b>Question Palette</b><br>';qs.forEach((x,i)=>{let b=document.createElement('button');b.textContent=i+1;if(ans[x.id])b.classList.add('done');b.onclick=()=>{idx=i;render()};p.appendChild(b)})}
function prev(){if(idx>0){idx--;render()}}function next(){if(idx<qs.length-1){idx++;render()}}
function finish(){if(!confirm('Submit your test?'))return;document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');let correct=qs.filter(q=>ans[q.id]===q.answer).length,attempted=Object.keys(ans).length;document.getElementById('score').textContent=`Score: ${correct} / ${qs.length}`;document.getElementById('stats').textContent=`Attempted: ${attempted} | Correct: ${correct} | Wrong: ${attempted-correct} | Unattempted: ${qs.length-attempted}`}
function review(){reviewMode=true;document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');idx=0;render()}render();
</script></body></html>
