<script>
const topics = [{"name": "Topic 1: Functions of an Operating System", "questions": [{"sourceNumber": 1, "question": "Which of the following is a function of an operating system?", "options": [{"key": "a", "text": "File management"}, {"key": "b", "text": "Memory management"}, {"key": "c", "text": "Process scheduling"}, {"key": "d", "text": "More than one of the above"}, {"key": "e", "text": "None of the above"}], "answer": "d", "explanation": "File management, memory management, and process scheduling are all key functions of an operating system to ensure efficient use of resources and smooth operation."}, {"sourceNumber": 2, "question": "How does an operating system handle multitasking?", "options": [{"key": "a", "text": "Runs one program at a time"}, {"key": "b", "text": "Allows multiple programs to run by sharing CPU time"}, {"key": "c", "text": "Shuts down unused programs automatically"}, {"key": "d", "text": "More than one of the above"}, {"key": "e", "text": "None of the above"}], "answer": "b", "explanation": "The OS switches CPU time among programs rapidly, giving the illusion that multiple programs run simultaneously. This sharing enables multitasking."}, {"sourceNumber": 3, "question": "What does the OS do in device management?", "options": [{"key": "a", "text": "File system management"}, {"key": "b", "text": "Process management"}, {"key": "c", "text": "Job accounting"}, {"key": "d", "text": "More than one of the above"}, {"key": "e", "text": "None of the above"}], "answer": "a", "explanation": "Device management involves managing input/output devices and coordinating which program can use them, ensuring proper communication between hardware and software."}, {"sourceNumber": 5, "question": "Which of these does the OS use to protect data and system resources?", "options": [{"key": "a", "text": "Access control"}, {"key": "b", "text": "Firewalls and security monitoring"}, {"key": "c", "text": "Resource allocation"}, {"key": "d", "text": "More than one of the above"}, {"key": "e", "text": "None of the above ### Topic - 2 Controlling System Performance (MCQs 6 to 10)"}], "answer": "b", "explanation": "Process management handles the execution of programs, schedules CPU time for each process, and manages process states to optimize system performance."}]}, {"name": "Topic 2: Controlling System Performance", "questions": [{"sourceNumber": 6, "question": "What does the OS monitor to control system performance?", "options": [{"key": "a", "text": "CPU temperature"}, {"key": "b", "text": "Delay between service request and delivery"}, {"key": "c", "text": "Number of installed programs"}, {"key": "d", "text": "More than one of the above"}, {"key": "e", "text": "None of the above"}], "answer": "d", "explanation": "The OS uses access control to restrict unauthorized access and firewalls and security monitoring tools to protect the system from threats, alongside managing resource allocation securely. Here are the answers with explanations for MCQs 6 to 25:"}, {"sourceNumber": 7, "question": "How does the OS improve system performance?", "options": [{"key": "a", "text": "Increasing RAM automatically"}, {"key": "b", "text": "Reducing delay in service delivery"}, {"key": "c", "text": "Installing antivirus software"}, {"key": "d", "text": "More than one of the above"}, {"key": "e", "text": "None of the above"}], "answer": "a", "explanation": "The OS manages RAM by allocating memory to running programs and freeing it when programs finish, keeping track of memory usage. **27.** Which part of memory does the OS manage directly? **Answer:** c) Main memory (RAM) **Explanation:** The OS controls the allocation and use of the system's main memory or RAM. **28.** What happens when a program finishes using memory? **Answer:** a) The OS frees the memory for reuse **Explanation:** The OS reclaims memory from finished programs so other programs can use it. **29.** Why is memory management important? **Answer:** b) To avoid conflicts and crashes between programs **Explanation:** Proper memory management prevents one program from overwriting another’s data, ensuring system stability. **30.** The OS keeps track of which memory belongs to which: **Answer:** c) Program **Explanation:** Memory management involves tracking ownership of memory blocks to allocate and free them correctly."}, {"sourceNumber": 8, "question": "Which of these is a goal of performance control by the OS?", "options": [{"key": "a", "text": "Faster response time"}, {"key": "b", "text": "More user accounts"}, {"key": "c", "text": "Longer boot time"}, {"key": "d", "text": "More than one of the above"}, {"key": "e", "text": "None of the above"}], "answer": "d", "explanation": "The OS manages device use, ensuring only authorized programs can use devices like printers or keyboards. **32.** When does the OS stop device communication? **Answer:** b) When a program finishes using the device **Explanation:** To avoid conflicts, the OS stops device access once the program no longer needs it. **33.** Which of the following is managed by the OS in device management? **Answer:** a) Input and output devices **Explanation:** Devices like keyboard, mouse, printers, and disks are managed by the OS. **34.** Device management helps in: **Answer:** c) Coordinating device access between multiple programs **Explanation:** The OS ensures that devices are shared and managed fairly among programs. **35.** Without device management, programs would have to: **Answer:** a) Control devices directly, leading to errors **Explanation:** The OS abstracts device control so programs don't need complex, error-prone device handling code."}, {"sourceNumber": 9, "question": "When does the OS check system performance?", "options": [{"key": "a", "text": "Only during startup"}, {"key": "b", "text": "Continuously during operation"}, {"key": "c", "text": "When new software is installed"}, {"key": "d", "text": "More than one of the above"}, {"key": "e", "text": "None of the above"}], "answer": "a", "explanation": "The OS manages software resources and provides an interface for users to use various software easily. **37.** Which software programs are coordinated by the OS? **Answer:** d) Compilers and assemblers **Explanation:** The OS manages access to software tools like compilers to ensure they run smoothly. **38.** Coordination between software and user means: **Answer:** c) OS helps users interact with programs **Explanation:** The OS provides mechanisms to facilitate user interaction with different software programs. **39.** What would happen without OS coordination? **Answer:** a) Users would face difficulty managing software resources **Explanation:** Coordination is necessary to avoid conflicts and ensure smooth operation. **40.** Coordination by the OS improves: **Answer:** d) User experience and software efficiency **Explanation:** The OS simplifies running and managing software, enhancing user productivity."}, {"sourceNumber": 10, "question": "Which is NOT related to system performance control by the OS?", "options": [{"key": "a", "text": "Checking service delays"}, {"key": "b", "text": "Improving resource utilization"}, {"key": "c", "text": "Displaying desktop wallpaper"}, {"key": "d", "text": "More than one of the above"}, {"key": "e", "text": "None of the above ### Topic - 3 File System Management (MCQs 11 to 15)"}], "answer": "a", "explanation": "A process is an active instance of a program being executed. **42.** How does the OS manage CPU time for processes? **Answer:** c) Process scheduling **Explanation:** The OS allocates CPU time fairly among processes using scheduling algorithms. **43.** Which is NOT a common scheduling algorithm? **Answer:** e) None of the above (all listed are common) **Explanation:** FCFS, SJF, LJF, Round Robin, and Priority Scheduling are common. **44.** What does FCFS scheduling do? **Answer:** b) Runs the process that arrived first first **Explanation:** First Come First Serve serves processes in order of arrival. **45.** Which scheduling favors short tasks? **Answer:** a) Shortest Job First (SJF) **Explanation:** SJF schedules the process with the shortest execution time next. **46.** Round Robin scheduling: **Answer:** c) Gives fixed time slices to each process in turn **Explanation:** Round Robin cycles through processes, giving each a small CPU time slice. **47.** Priority scheduling: **Answer:** b) Runs processes based on priority level **Explanation:** Processes with higher priority run before lower priority ones. **48.** Process management reduces: **Answer:** a) Waiting time **Explanation:** Efficient scheduling reduces time processes wait for CPU access. **49.** Without process management, CPU usage would be: **Answer:** d) Inefficient and chaotic **Explanation:** The OS organizes CPU time allocation to avoid chaos and improve performance. **50.** Process scheduling helps: **Answer:** c) Run multiple processes fairly **Explanation:** Scheduling ensures all active processes get CPU time fairly."}]}, {"name": "Topic 3: File System Management", "questions": [{"sourceNumber": 11, "question": "What does the OS do in file system management?", "options": [{"key": "a", "text": "Stores files on disk"}, {"key": "b", "text": "Organizes files and folders"}, {"key": "c", "text": "Deletes files as requested"}, {"key": "d", "text": "More than one of the above"}, {"key": "e", "text": "None of the above"}], "answer": "a", "explanation": "The OS manages allocation of hardware resources to processes. **52.** Why is fair resource allocation important? **Answer:** c) To prevent resource starvation **Explanation:** Fairness ensures all processes get needed resources without being blocked indefinitely. **53.** Resource allocation in the OS is: **Answer:** d) Dynamic and continuous **Explanation:** The OS constantly allocates and re-allocates resources based on needs. **54.** Which of the following is an OS resource? **Answer:** b) Memory **Explanation:** Memory is a critical resource managed by the OS. **55.** What happens if resource allocation is poor? **Answer:** a) System performance degrades **Explanation:** Poor allocation causes delays, crashes, and inefficiency."}, {"sourceNumber": 12, "question": "Which information does the OS keep track of in file management?", "options": [{"key": "a", "text": "File size"}, {"key": "b", "text": "File creation date"}, {"key": "c", "text": "File permissions"}, {"key": "d", "text": "More than one of the above"}, {"key": "e", "text": "None of the above"}], "answer": "a", "explanation": "OS uses permissions and security mechanisms to protect data. **57.** Which tool is used by OS for security? **Answer:** d) Firewalls **Explanation:** Firewalls monitor and block unauthorized network access. **58.** Why is resource protection important? **Answer:** c) To avoid data loss and misuse **Explanation:** Protecting resources maintains system integrity and privacy. **59.** How does OS detect security threats? **Answer:** b) Monitoring system activities continuously **Explanation:** Constant monitoring helps catch suspicious actions early. **60.** If security is compromised, the OS: **Answer:** a) Alerts users and takes preventive action **Explanation:** The OS notifies users and tries to block threats."}, {"sourceNumber": 13, "question": "How does the OS manage files?", "options": [{"key": "a", "text": "Reading and writing data"}, {"key": "b", "text": "Compressing files automatically"}, {"key": "c", "text": "Encrypting files without user input"}, {"key": "d", "text": "More than one of the above"}, {"key": "e", "text": "None of the above"}], "answer": "a", "explanation": "The OS handles data flow between devices like keyboard, mouse, and software. **62.** I/O management ensures: **Answer:** d) Smooth operation and device sharing **Explanation:** The OS coordinates device access to avoid conflicts. **63.** Which of these is an input device? **Answer:** b) Keyboard **Explanation:** Keyboard is an input device managed by the OS. **64.** Output devices include: **Answer:** c) Printers and monitors **Explanation:** These devices display or print data, controlled by the OS. **65.** Without OS handling, I/O devices would be: **Answer:** e) Hard to manage and prone to errors **Explanation:** Direct control by applications would be complex and error-prone."}, {"sourceNumber": 14, "question": "Which of these is NOT a file system operation by the OS?", "options": [{"key": "a", "text": "Creating files"}, {"key": "b", "text": "Writing data"}, {"key": "c", "text": "Printing files directly"}, {"key": "d", "text": "More than one of the above"}, {"key": "e", "text": "None of the above"}], "answer": "c", "explanation": "The OS schedules jobs based on priority levels. **67.** Higher priority jobs are: **Answer:** a) Executed before lower priority ones **Explanation:** Priority scheduling favors important tasks first. **68.** Priority can be assigned based on: **Answer:** d) Importance or urgency **Explanation:** OS assigns priority according to criteria like job criticality. **69.** Priority management helps avoid: **Answer:** b) Starvation of important jobs **Explanation:** Ensures critical jobs run in time. **70.** If priorities are equal, the OS may use: **Answer:** a) Round Robin scheduling **Explanation:** OS can use fair time sharing for equal priority jobs."}, {"sourceNumber": 15, "question": "The OS file system primarily manages:", "options": [{"key": "a", "text": "File storage devices"}, {"key": "b", "text": "Internet connectivity"}, {"key": "c", "text": "User account passwords"}, {"key": "d", "text": "More than one of the above"}, {"key": "e", "text": "None of the above ### Topic - 4 User Interface (UI) (MCQs 16 to 20)"}], "answer": "b", "explanation": "These programs optimize OS performance dynamically. **72.** Such control programs improve: **Answer:** a) Resource utilization **Explanation:** They manage resources to reduce waste. **73.** Examples of control programs include: **Answer:** c) Device drivers and system utilities **Explanation:** These manage devices and system tasks. **74.** Control programs run: **Answer:** d) In the background **Explanation:** They operate without user intervention. **75.** Without special control programs, OS would be: **Answer:** e) Less efficient and more manual **Explanation:** Automation helps OS run smoothly."}]}, {"name": "Topic 4: User Interface (UI)", "questions": [{"sourceNumber": 16, "question": "Which types of user interfaces does the OS provide?", "options": [{"key": "a", "text": "Command Line Interface (CLI)"}, {"key": "b", "text": "Graphical User Interface (GUI)"}, {"key": "c", "text": "Voice-based Interface"}, {"key": "d", "text": "More than one of the above"}, {"key": "e", "text": "None of the above"}], "answer": "a", "explanation": "OS schedules tasks to optimize resource use. **77.** Scheduling is crucial when: **Answer:** c) Multiple tasks need to run simultaneously **Explanation:** OS manages concurrency. **78.** What is NOT a scheduling goal? **Answer:** b) Running tasks randomly **Explanation:** Scheduling aims for order and fairness. **79.** Scheduling improves: **Answer:** d) System throughput and responsiveness **Explanation:** Proper scheduling boosts performance. **80.** OS schedules resources based on: **Answer:** a) Task priority and resource availability **Explanation:** These factors guide scheduling decisions."}, {"sourceNumber": 17, "question": "Which is an example of a GUI provided by an OS?", "options": [{"key": "a", "text": "Windows desktop"}, {"key": "b", "text": "Linux Terminal"}, {"key": "c", "text": "Android command prompt"}, {"key": "d", "text": "More than one of the above"}, {"key": "e", "text": "None of the above"}], "answer": "a", "explanation": "Security defends against unauthorized access and damage. **82.** Firewalls help by: **Answer:** b) Blocking malicious network traffic **Explanation:** They monitor and filter incoming/outgoing data. **83.** Modern OS security includes: **Answer:** d) Antivirus, firewalls, and encryption **Explanation:** Multiple tools protect the system. **84.** User authentication is part of: **Answer:** c) OS security **Explanation:** Verifying user identity is critical for protection. **85.** Without proper security, OS may suffer: **Answer:** a) Data breaches and system failures **Explanation:** Lack of security risks compromise and damage."}, {"sourceNumber": 18, "question": "What does the UI allow users to do?", "options": [{"key": "a", "text": "Run applications"}, {"key": "b", "text": "Control hardware directly"}, {"key": "c", "text": "Modify OS kernel code"}, {"key": "d", "text": "More than one of the above"}, {"key": "e", "text": "None of the above"}], "answer": "a", "explanation": "Error detection helps prevent further damage. **87.** How does OS protect data in multi-user systems? **Answer:** a) By monitoring access and restricting unauthorized use **Explanation:** Prevents users from accessing others’ data. **88.** Monitoring activities include: **Answer:** a) Checking hardware and software status **Explanation:** OS watches system health to avoid failures. **89.** When hardware issues arise, OS: **Answer:** a) Alerts the user **Explanation:** Notifies users to take action or prevent damage. **90.** Monitoring helps in: **Answer:** a) Preventing system crashes **Explanation:** Early detection of problems improves stability."}, {"sourceNumber": 19, "question": "The CLI is primarily used in:", "options": [{"key": "a", "text": "Windows GUI"}, {"key": "b", "text": "Linux Terminal"}, {"key": "c", "text": "Web browsers"}, {"key": "d", "text": "More than one of the above"}, {"key": "e", "text": "None of the above"}], "answer": "", "explanation": "Explanation not available in the provided source."}, {"sourceNumber": 20, "question": "Which is NOT a function of an OS user interface?", "options": [{"key": "a", "text": "Interaction with applications"}, {"key": "b", "text": "Direct hardware manipulation by users"}, {"key": "c", "text": "Displaying output to users"}, {"key": "d", "text": "More than one of the above"}, {"key": "e", "text": "None of the above ### Topic - 5 Multiprogramming and Multitasking (MCQs 21 to 25)"}], "answer": "", "explanation": "Explanation not available in the provided source."}]}, {"name": "Topic 5: Multiprogramming and Multitasking", "questions": [{"sourceNumber": 21, "question": "What is multitasking in an OS?", "options": [{"key": "a", "text": "Running one program at a time"}, {"key": "b", "text": "Running multiple applications simultaneously"}, {"key": "c", "text": "Only running background processes"}, {"key": "d", "text": "More than one of the above"}, {"key": "e", "text": "None of the above"}], "answer": "", "explanation": "Explanation not available in the provided source."}, {"sourceNumber": 22, "question": "What does multiprogramming allow?", "options": [{"key": "a", "text": "Many programs share CPU time efficiently"}, {"key": "b", "text": "Only one program in memory at a time"}, {"key": "c", "text": "Programs run without memory"}, {"key": "d", "text": "More than one of the above"}, {"key": "e", "text": "None of the above"}], "answer": "", "explanation": "Explanation not available in the provided source."}, {"sourceNumber": 23, "question": "How does multitasking improve user experience?", "options": [{"key": "a", "text": "By allowing quick switching between programs"}, {"key": "b", "text": "By preventing programs from running"}, {"key": "c", "text": "By disabling all background tasks"}, {"key": "d", "text": "More than one of the above"}, {"key": "e", "text": "None of the above"}], "answer": "", "explanation": "Explanation not available in the provided source."}, {"sourceNumber": 24, "question": "Which is true about multiprogramming?", "options": [{"key": "a", "text": "Multiple programs loaded into memory at once"}, {"key": "b", "text": "CPU executes programs one after another without delay"}, {"key": "c", "text": "Programs run only in the background"}, {"key": "d", "text": "More than one of the above"}, {"key": "e", "text": "None of the above"}], "answer": "", "explanation": "Explanation not available in the provided source."}, {"sourceNumber": 25, "question": "Which is NOT related to multitasking or multiprogramming?", "options": [{"key": "a", "text": "Sharing CPU time among programs"}, {"key": "b", "text": "Running multiple applications simultaneously"}, {"key": "c", "text": "Increasing CPU clock speed"}, {"key": "d", "text": "More than one of the above"}, {"key": "e", "text": "None of the above ### 26 to 30: Topic - 6 Memory Management"}], "answer": "", "explanation": "Explanation not available in the provided source."}]}, {"name": "Topic 6: Memory Management", "questions": [{"sourceNumber": 26, "question": "What is the main function of memory management in an OS?", "options": [{"key": "a", "text": "Managing storage devices"}, {"key": "b", "text": "Allocating and freeing RAM to programs"}, {"key": "c", "text": "Managing file systems"}, {"key": "d", "text": "More than one of the above"}, {"key": "e", "text": "None of the above"}], "answer": "", "explanation": "Explanation not available in the provided source."}, {"sourceNumber": 27, "question": "The OS keeps track of which memory is free or in use in order to:", "options": [{"key": "a", "text": "Improve file management"}, {"key": "b", "text": "Efficiently allocate RAM to running programs"}, {"key": "c", "text": "Control peripheral devices"}, {"key": "d", "text": "More than one of the above"}, {"key": "e", "text": "None of the above"}], "answer": "", "explanation": "Explanation not available in the provided source."}, {"sourceNumber": 28, "question": "When a program finishes execution, memory management:", "options": [{"key": "a", "text": "Allocates more memory to it"}, {"key": "b", "text": "Frees the memory previously allocated"}, {"key": "c", "text": "Deletes the program from disk"}, {"key": "d", "text": "More than one of the above"}, {"   reviewMode = false;
  show(quiz);
  renderQuestion();
}

function renderQuestion(){
  const topic = topics[currentTopic];
  const questions = topic.questions;

  if (!questions.length) {
    document.getElementById('questionText').textContent = 'No questions found for this topic.';
    document.getElementById('options').innerHTML = '';
    return;
  }

  const q = questions[currentIndex];
  document.getElementById('topicTitle').textContent = topic.name;
  document.getElementById('progress').textContent = `Question ${currentIndex + 1} of ${questions.length}`;
  document.getElementById('questionText').textContent = q.question;

  const optionsBox = document.getElementById('options');
  optionsBox.innerHTML = '';

  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt.key.toUpperCase() + ') ' + opt.text;

    if (answers[currentIndex] === opt.key) btn.classList.add('selected');

    if (reviewMode) {
      btn.disabled = true;
      if (q.answer && opt.key === q.answer) btn.classList.add('correct');
      if (answers[currentIndex] === opt.key && q.answer && opt.key !== q.answer) btn.classList.add('wrong');
    } else {
      btn.onclick = () => {
        answers[currentIndex] = opt.key;
        renderQuestion();
      };
    }
    optionsBox.appendChild(btn);
  });

  const reviewBox = document.getElementById('reviewBox');
  if (reviewMode) {
    reviewBox.classList.remove('hidden');
    const correct = q.options.find(o => o.key === q.answer);
    reviewBox.innerHTML =
      `<b>Your Answer:</b> ${answers[currentIndex] ? answers[currentIndex].toUpperCase() : 'Not Attempted'}<br>` +
      `<b>Correct Answer:</b> ${correct ? correct.key.toUpperCase() + ') ' + correct.text : 'Not available'}<br><br>` +
      `<b>Explanation:</b><br>${q.explanation || 'Explanation not available in the provided source.'}`;
  } else {
    reviewBox.classList.add('hidden');
  }

  document.getElementById('prevBtn').disabled = currentIndex === 0;
  document.getElementById('nextBtn').disabled = currentIndex === questions.length - 1;
  document.getElementById('submitBtn').style.display = reviewMode ? 'none' : 'inline-block';

  renderPalette();
}

function renderPalette(){
  const box = document.getElementById('palette');
  box.innerHTML = '';
  topics[currentTopic].questions.forEach((q, i) => {
    const b = document.createElement('button');
    b.className = 'palette-btn';
    b.textContent = i + 1;
    if (answers[i]) b.classList.add('answered');
    if (i === currentIndex) b.classList.add(reviewMode ? 'review-current' : 'current');
    b.onclick = () => {
      currentIndex = i;
      renderQuestion();
    };
    box.appendChild(b);
  });
}

document.getElementById('prevBtn').onclick = () => {
  if (currentIndex > 0) {
    currentIndex--;
    renderQuestion();
  }
};

document.getElementById('nextBtn').onclick = () => {
  if (currentIndex < topics[currentTopic].questions.length - 1) {
    currentIndex++;
    renderQuestion();
  }
};

document.getElementById('topicsBtn').onclick = () => {
  reviewMode = false;
  show(home);
};

document.getElementById('resultTopicsBtn').onclick = () => {
  reviewMode = false;
  show(home);
};

document.getElementById('submitBtn').onclick = () => {
  const qs = topics[currentTopic].questions;
  const attempted = Object.keys(answers).length;
  const correct = qs.reduce((sum, q, i) => sum + (q.answer && answers[i] === q.answer ? 1 : 0), 0);
  const wrong = attempted - correct;
  document.getElementById('scoreText').textContent = `Score: ${correct} / ${qs.length}`;
  document.getElementById('statsText').textContent =
    `Attempted: ${attempted} | Correct: ${correct} | Wrong: ${wrong} | Unattempted: ${qs.length - attempted}`;
  show(result);
};

document.getElementById('reviewBtn').onclick = () => {
  reviewMode = true;
  currentIndex = 0;
  show(quiz);
  renderQuestion();
};

document.getElementById('retryBtn').onclick = () => {
  answers = {};
  currentIndex = 0;
  reviewMode = false;
  show(quiz);
  renderQuestion();
};

renderTopics();
</script>
</body>
</html>
