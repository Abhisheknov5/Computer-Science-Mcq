
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Operating System - MCQ Practice</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#1f2937}.container{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border-radius:14px;padding:24px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,.08)}.hidden{display:none}button{padding:11px 16px;border:0;border-radius:8px;cursor:pointer;font-size:15px;background:#e5e7eb}.topic-btn,.option{width:100%;text-align:left;padding:15px;margin:10px 0;border:1px solid #d1d5db;border-radius:10px;background:#fff;font-size:16px;cursor:pointer}.topic-btn{font-weight:bold}.selected{border:2px solid #2563eb;background:#eff6ff}.correct{background:#dcfce7;border-color:#16a34a}.wrong{background:#fee2e2;border-color:#dc2626}.primary{background:#2563eb;color:#fff}.controls,.topbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}#palette button{min-width:42px;margin:4px}.done{background:#bbf7d0}.explanation{margin-top:16px;padding:14px;background:#f8fafc;border-radius:9px;line-height:1.6}.small{color:#6b7280}</style></head><body><div class="container">
<div id="home" class="card"><h1>💻 Operating System MCQ Practice</h1><p class="small">Select a topic to start MCQ practice.</p><div id="topicList"></div></div>
<div id="quiz" class="hidden"><div class="card topbar"><b id="progress"></b><b id="topicTitle"></b></div><div class="card"><h2 id="question"></h2><div id="options"></div><div id="explanation" class="hidden explanation"></div></div><div class="card controls"><div><button onclick="prev()">Previous</button><button class="primary" onclick="next()">Next</button></div><div><button onclick="goHome()">Topics</button><button class="primary" onclick="submitTest()">Submit Test</button></div></div><div class="card"><b>Question Palette</b><div id="palette"></div></div></div>

<script>
const topics=[{"name": "Topic 1: Operating System", "questions": [{"id": 1, "question": "What is the primary role of an operating system?", "options": ["Create application software", "Act as an interface between user and hardware", "Convert hardware into software", "More than one of the above", "None of the above"], "answer": "b", "explanation": "The OS serves as a bridge between users and the computer hardware, managing resources and providing an interface."}, {"id": 2, "question": "Which of the following is a component of a computer system?", "options": ["Users", "Application Programs", "Hardware", "More than one of the above", "None of the above"], "answer": "d", "explanation": "A computer system includes users, application programs, hardware, and more."}, {"id": 3, "question": "What does computer hardware understand?", "options": ["Machine code (0s and 1s)", "Java", "Python", "More than one of the above", "None of the above"], "answer": "a", "explanation": "Hardware executes instructions written in binary machine code, not high-level languages."}, {"id": 4, "question": "The operating system manages which of the following?", "options": ["CPU", "Memory", "Files", "More than one of the above", "None of the above"], "answer": "d", "explanation": "The OS manages CPU, memory, files, and other hardware/software resources."}, {"id": 5, "question": "What type of programs are compilers, video players, and browsers?", "options": ["Hardware", "Application Programs", "Operating Systems", "More than one of the above", "None of the above"], "answer": "b", "explanation": "These are user-level software that perform specific tasks, not system-level programs."}, {"id": 6, "question": "What are system programs?", "options": ["Editors", "Shells", "Compilers", "More than one of the above", "None of the above"], "answer": "d", "explanation": "Editors, shells, and compilers are system programs that help run the OS or develop software."}, {"id": 7, "question": "Which is true about an operating system?", "options": ["It’s a system program", "Acts as an interface", "Manages hardware", "More than one of the above", "None of the above"], "answer": "d", "explanation": "The OS is a system program, acts as an interface, and manages hardware."}, {"id": 8, "question": "Which of the following is NOT managed by the operating system?", "options": ["Processes", "Security", "Weather reports", "More than one of the above", "None of the above"], "answer": "c", "explanation": "Weather reports are external data and not managed by the OS."}, {"id": 9, "question": "Which is a hardware component?", "options": ["CPU", "Disk", "Memory", "More than one of the above", "None of the above"], "answer": "d", "explanation": "CPU, disk, and memory are all hardware parts of a computer."}, {"id": 10, "question": "Who are the users in a computer system?", "options": ["Developers", "General public", "People interacting with the system", "More than one of the above", "None of the above #### **11–20: Topic - 2 Structure of Computer System & Process Management**"], "answer": "d", "explanation": "Users can include developers, the general public, or anyone interacting with the system."}]}, {"name": "Topic 2: Structure of Computer System & Process Management", "questions": [{"id": 11, "question": "Which of the following belongs to application software?", "options": ["Browser", "Game", "Compiler", "More than one of the above", "None of the above"], "answer": "d", "explanation": "Browsers and games are application software; compilers are system software."}, {"id": 12, "question": "What is the function of the OS related to files?", "options": ["Organize", "Retrieve", "Manage", "More than one of the above", "None of the above"], "answer": "d", "explanation": "OS organizes, retrieves, and manages files."}, {"id": 13, "question": "Process management involves:", "options": ["Scheduling", "Creation", "Termination", "More than one of the above", "None of the above"], "answer": "d", "explanation": "It includes process creation, scheduling, and termination."}, {"id": 14, "question": "Which of these manages multiple programs without conflict?", "options": ["File system", "Process synchronizer", "OS", "More than one of the above", "None of the above"], "answer": "c", "explanation": "The OS handles multiple processes and avoids conflicts."}, {"id": 15, "question": "Process synchronization ensures:", "options": ["System shutdown", "Coordinated execution", "Random execution", "More than one of the above", "None of the above"], "answer": "b", "explanation": "Synchronization coordinates processes to prevent conflicts or race conditions."}, {"id": 16, "question": "What is the function of CPU scheduling?", "options": ["Allocate CPU", "Stop processes", "Manage files", "More than one of the above", "None of the above"], "answer": "a", "explanation": "CPU scheduling allocates CPU time among processes efficiently."}, {"id": 17, "question": "An OS provides memory management by:", "options": ["Allocating memory", "Deallocating memory", "Increasing RAM", "More than one of the above", "None of the above"], "answer": "d", "explanation": "OS allocates and deallocates memory as required."}, {"id": 18, "question": "Which of the following is not a role of an OS?", "options": ["Memory management", "Process termination", "Internet browsing", "More than one of the above", "None of the above"], "answer": "c", "explanation": "Browsing is done by applications, not the OS itself."}, {"id": 19, "question": "What does the OS manage during multitasking?", "options": ["Processes", "Memory", "CPU", "More than one of the above", "None of the above"], "answer": "d", "explanation": "OS manages processes, memory, and CPU during multitasking."}, {"id": 20, "question": "What does a system program do?", "options": ["Manage applications", "Help manage the OS", "Includes shells and editors", "More than one of the above", "None of the above #### **21–30: Topic - 3 Memory, CPU, and File Management**"], "answer": "d", "explanation": "System programs help manage the OS and include shells and editors."}]}, {"name": "Topic 3: Memory, CPU, and File Management", "questions": [{"id": 21, "question": "File management includes:", "options": ["File retrieval", "File storage", "File organization", "More than one of the above", "None of the above"], "answer": "d", "explanation": "It includes file storage, retrieval, and organization."}, {"id": 22, "question": "The operating system handles which aspect of memory?", "options": ["Virtual memory", "Primary memory", "Allocation", "More than one of the above", "None of the above"], "answer": "d", "explanation": "OS manages virtual memory, primary memory, and allocation."}, {"id": 23, "question": "Which is not a direct function of an OS?", "options": ["Memory allocation", "Making hardware", "File security", "More than one of the above", "None of the above"], "answer": "b", "explanation": "OS manages hardware but does not manufacture it."}, {"id": 24, "question": "What is used to allocate CPU time to processes?", "options": ["Process handler", "Memory block", "CPU scheduler", "More than one of the above", "None of the above"], "answer": "c", "explanation": "The CPU scheduler decides which process gets CPU time and when."}, {"id": 25, "question": "What does a process include?", "options": ["Program counter", "Registers", "Process state", "More than one of the above", "None of the above"], "answer": "d", "explanation": "A process includes the program counter, registers, and process state."}, {"id": 26, "question": "Who handles the creation of processes?", "options": ["Application", "Hardware", "OS", "More than one of the above", "None of the above"], "answer": "c", "explanation": "OS is responsible for creating and managing processes."}, {"id": 27, "question": "What decides which process to run next?", "options": ["CPU", "OS", "Scheduler", "More than one of the above", "None of the above"], "answer": "c", "explanation": "The scheduler decides process execution order."}, {"id": 28, "question": "What stores files permanently?", "options": ["RAM", "Cache", "Hard Disk", "More than one of the above", "None of the above"], "answer": "c", "explanation": "Hard disks provide persistent storage, unlike RAM or cache."}, {"id": 29, "question": "Which part of the OS provides a user-friendly interface?", "options": ["Shell", "Hardware", "Compiler", "More than one of the above", "None of the above"], "answer": "a", "explanation": "Shell allows users to interact with the OS via commands or GUI."}, {"id": 30, "question": "Which is NOT managed by file management?", "options": ["File naming", "File format", "File printing", "More than one of the above", "None of the above #### **31–40: Topic - 4 Security & Summary Concepts**"], "answer": "c", "explanation": "Printing is managed by device drivers or application software, not file management."}]}, {"name": "Topic 4: Security & Summary Concepts", "questions": [{"id": 31, "question": "OS security includes:", "options": ["Access control", "Data protection", "Antivirus software", "More than one of the above", "None of the above"], "answer": "d", "explanation": "OS security covers access control and data protection; antivirus is separate software."}, {"id": 32, "question": "The shell is a part of:", "options": ["Application software", "System programs", "Hardware", "More than one of the above", "None of the above"], "answer": "b", "explanation": "Shells are system software enabling user interaction with the OS."}, {"id": 33, "question": "Which manages interaction between application and hardware?", "options": ["Application software", "System software", "Operating System", "More than one of the above", "None of the above"], "answer": "c", "explanation": "OS manages communication between applications and hardware."}, {"id": 34, "question": "What keeps track of the status of each process?", "options": ["Process table", "File system", "RAM", "More than one of the above", "None of the above"], "answer": "a", "explanation": "Process table stores the information of all active processes."}, {"id": 35, "question": "When is memory deallocated?", "options": ["Process termination", "Process start", "File deletion", "More than one of the above", "None of the above"], "answer": "a", "explanation": "When a process ends, the OS frees its allocated memory."}, {"id": 36, "question": "Who decides file access permissions?", "options": ["OS", "User", "File system", "More than one of the above", "None of the above"], "answer": "a", "explanation": "OS manages file permissions and access control."}, {"id": 37, "question": "Which is not part of OS functionality?", "options": ["Email sending", "Memory allocation", "Process handling", "More than one of the above", "None of the above"], "answer": "a", "explanation": "Email sending is handled by applications, not OS functions."}, {"id": 38, "question": "Application programs require what to interact with hardware?", "options": ["Kernel", "Driver", "Operating System", "More than one of the above", "None of the above"], "answer": "c", "explanation": "OS acts as an intermediary between hardware and applications."}, {"id": 39, "question": "The OS helps provide what kind of environment to users?", "options": ["Slow and limited", "Reliable and efficient", "Confusing", "More than one of the above", "None of the above"], "answer": "b", "explanation": "OS ensures a stable, efficient, and user-friendly environment."}, {"id": 40, "question": "Which of the following is managed by the OS?", "options": ["Process management", "CPU scheduling", "File security", "More than one of the above", "None of the above Topic - 5 Purpose of Operating System ### MCQs 41–50"], "answer": "d", "explanation": "OS manages process management, CPU scheduling, and file security. Sure! Here are the **answers with explanations** for MCQs 41 to 50:"}]}, {"name": "Topic 5: Purpose of Operating System", "questions": [{"id": 41, "question": "What is the main role of an operating system?", "options": ["To create hardware", "To help run software easily and efficiently", "To build application software", "More than one of the above", "None of the above"], "answer": "b", "explanation": "The OS manages the hardware and provides services to software, making it easier for programs to run without handling hardware details directly."}, {"id": 42, "question": "Without an operating system, what would programs need to do?", "options": ["Use cloud computing", "Create their own way to interact with hardware", "Run faster", "More than one of the above", "None of the above"], "answer": "b", "explanation": "Without an OS, each program must manage hardware communication itself, which is complex and inefficient."}, {"id": 43, "question": "How does the OS act between software and hardware?", "options": ["As a software developer", "As a middleman or interface", "As a hardware creator", "More than one of the above", "None of the above"], "answer": "b", "explanation": "The OS serves as a mediator that allows software to communicate with hardware without knowing the hardware’s inner workings."}, {"id": 44, "question": "Why don’t applications need to know how hardware works inside?", "options": ["Because they are built in hardware language", "Because the OS provides a common way to use hardware", "Because hardware is simple", "More than one of the above", "None of the above"], "answer": "b", "explanation": "The OS abstracts hardware details and offers standard interfaces, so applications don’t need to manage hardware directly."}, {"id": 45, "question": "Which of the following tasks does an OS handle?", "options": ["Sending data over the network", "Showing things on the screen", "Managing files and memory", "More than one of the above", "None of the above"], "answer": "d", "explanation": "The OS handles many tasks, including managing network data transfer, displaying output on the screen, and managing files and memory."}, {"id": 46, "question": "How does the OS make software development easier?", "options": ["By writing software for developers", "By building hardware components", "By providing a simple way to use hardware so programmers don’t write complex code", "More than one of the above", "None of the above"], "answer": "c", "explanation": "The OS provides standardized hardware access, so developers don’t have to write complex, hardware-specific code."}, {"id": 47, "question": "What would happen if each application managed hardware on its own?", "options": ["It would run faster", "It would be easier for developers", "It would be very difficult and require extra work", "More than one of the above", "None of the above"], "answer": "c", "explanation": "Managing hardware individually for each program would lead to complexity, redundancy, and errors."}, {"id": 48, "question": "What kind of control does the OS provide to users?", "options": ["Complex and confusing controls", "A simple way to control and manage hardware and software", "No control at all", "More than one of the above", "None of the above"], "answer": "b", "explanation": "The OS provides users with an easy and unified interface to control hardware and software components."}, {"id": 49, "question": "The operating system acts as:", "options": ["A file manager only", "A communication bridge between hardware and software", "A hardware manufacturer", "More than one of the above", "None of the above"], "answer": "b", "explanation": "The OS bridges the gap between hardware and software, allowing them to work together seamlessly."}, {"id": 50, "question": "Which of the following best describes the OS?", "options": ["A program that builds applications", "A middleman that helps software and hardware work together safely", "A hardware component", "More than one of the above", "None of the above"], "answer": "b", "explanation": "The OS ensures safe and efficient cooperation between hardware and software by managing resources and access."}]}];let qs=[],index=0,answers={},reviewMode=false;
function show(id){['home','quiz','result'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}
function renderTopics(){const b=document.getElementById('topicList');b.innerHTML='';topics.forEach((t,i)=>{const x=document.createElement('button');x.className='topic-btn';x.textContent=`${t.name} (${t.questions.length} Questions)`;x.onclick=()=>start(i);b.appendChild(x)})}
function start(i){qs=topics[i].questions;index=0;answers={};reviewMode=false;document.getElementById('topicTitle').textContent=topics[i].name;show('quiz');render()}
function render(){const q=qs[index];document.getElementById('progress').textContent=`Question ${index+1} of ${qs.length}`;document.getElementById('question').textContent=q.question;const b=document.getElementById('options');b.innerHTML='';q.options.forEach((o,i)=>{const l='abcde'[i],x=document.createElement('button');x.className='option';x.textContent=l.toUpperCase()+') '+o;if(answers[index]===l)x.classList.add('selected');if(reviewMode){x.disabled=true;if(l===q.answer)x.classList.add('correct');if(answers[index]===l&&l!==q.answer)x.classList.add('wrong')}else x.onclick=()=>{answers[index]=l;render()};b.appendChild(x)});const e=document.getElementById('explanation');if(reviewMode){e.classList.remove('hidden');const ai='abcde'.indexOf(q.answer);e.innerHTML='<b>Correct Answer: '+q.answer.toUpperCase()+') '+q.options[ai]+'</b><br><br><b>Explanation:</b><br>'+(q.explanation||'Explanation not available.')}else e.classList.add('hidden');const p=document.getElementById('palette');p.innerHTML='';qs.forEach((_,i)=>{const x=document.createElement('button');x.textContent=i+1;if(answers[i])x.classList.add('done');x.onclick=()=>{index=i;render()};p.appendChild(x)})}
function prev(){if(index>0){index--;render()}}function next(){if(index<qs.length-1){index++;render()}}function submitTest(){const c=qs.filter((q,i)=>answers[i]===q.answer).length,a=Object.keys(answers).length;document.getElementById('score').textContent=`Score: ${c} / ${qs.length}`;document.getElementById('stats').textContent=`Attempted: ${a} | Correct: ${c} | Wrong: ${a-c} | Unattempted: ${qs.length-a}`;show('result')}function review(){reviewMode=true;index=0;show('quiz');render()}function restart(){answers={};index=0;reviewMode=false;show('quiz');render()}function goHome(){show('home')}renderTopics();
</script></body></html>
