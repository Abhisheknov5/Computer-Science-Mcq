<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>2's Complement MCQ Practice</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#1f2937}
.container{max-width:900px;margin:30px auto;padding:20px}.card{background:#fff;border-radius:16px;padding:28px;box-shadow:0 3px 15px rgba(0,0,0,.08);margin-bottom:18px}
h1{margin-top:0}.topic{width:100%;padding:18px;margin:12px 0;border:1px solid #d1d5db;border-radius:10px;background:#fff;font-size:18px;font-weight:bold;text-align:left;cursor:pointer}.topic:hover{background:#eff6ff;border-color:#2563eb}
.hidden{display:none}.option{width:100%;padding:14px;margin:10px 0;text-align:left;border:1px solid #d1d5db;border-radius:10px;background:#fff;font-size:16px;cursor:pointer}.selected{border:2px solid #2563eb;background:#eff6ff}.correct{background:#dcfce7;border-color:#16a34a}.wrong{background:#fee2e2;border-color:#dc2626}
button{padding:11px 16px;border:0;border-radius:8px;font-size:16px;cursor:pointer;margin:4px}.primary{background:#2563eb;color:#fff}.secondary{background:#e5e7eb}.bar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.explanation{margin-top:15px;padding:15px;background:#f8fafc;border-radius:10px;line-height:1.6}.palette button{min-width:42px}.done{background:#bbf7d0}.muted{color:#6b7280}
</style></head>
<body><div class="container">
<div id="home" class="card">
<h1>📚 2's Complement MCQ Practice</h1><p class="muted">Select a topic to start practice.</p>
<button class="topic" onclick="startTopic(&quot;Topic-1: 2's Complement&quot;)">📘 Topic-1: 2's Complement (30 Questions)</button>
<button class="topic" onclick="startTopic(&quot;Topic-2: Use of 2's Complement&quot;)">📗 Topic-2: Use of 2's Complement (20 Questions)</button>
</div>
<div id="quiz" class="hidden">
<div class="card bar"><b id="progress"></b><b id="topicTitle"></b></div>
<div class="card"><h2 id="question"></h2><div id="options"></div><div id="explanation" class="hidden explanation"></div></div>
<div class="card bar"><div><button class="secondary" onclick="prevQ()">Previous</button><button class="primary" onclick="nextQ()">Next</button></div><div><button class="secondary" onclick="goHome()">Topics</button><button class="primary" onclick="finish()">Submit Test</button></div></div>
<div id="palette" class="card palette"></div></div>
<div id="result" class="card hidden"><h1>🎯 Result</h1><h2 id="score"></h2><p id="stats"></p><button class="primary" onclick="review()">Review Answers & Explanations</button><button class="secondary" onclick="restart()">Try Again</button><button onclick="goHome()">Back to Topics</button></div>
</div>
<script>
const topics = {"Topic-1: 2's Complement": [{"id": 1, "question": "What is the first step to find the 2's complement of a binary number?", "options": ["Add 1 to the number", "Find the 1's complement of the number", "Invert the number twice", "More than one of the above", "None of the above"], "answer": "b", "explanation": "The first step in finding the 2's complement is to find the 1's complement (invert all bits)."}, {"id": 2, "question": "How do you obtain the 2's complement after finding the 1's complement?", "options": ["Subtract 1 from the LSB", "Add 1 to the MSB", "Add 1 to the LSB", "More than one of the above", "None of the above"], "answer": "c", "explanation": "After obtaining the 1's complement, add 1 to the least significant bit (LSB) to get the 2's complement."}, {"id": 3, "question": "What is the 2's complement of binary number 1011001?", "options": ["0100110", "0100111", "1011001", "More than one of the above", "None of the above"], "answer": "b", "explanation": "1's complement of 1011001 is 0100110, adding 1 gives 0100111."}, {"id": 4, "question": "Which logic gates are commonly used to implement the 2's complement circuit?", "options": ["AND, OR, NOT", "XOR, NAND, NOR", "OR, XOR, NOT", "More than one of the above", "None of the above"], "answer": "a", "explanation": "The 2's complement logic circuit can be designed using these gates to invert bits and add 1."}, {"id": 5, "question": "What is the 1's complement of the binary number 110100?", "options": ["110011", "001011", "001100", "More than one of the above", "None of the above"], "answer": "b", "explanation": "1's complement flips all bits of 110100 to 001011."}, {"id": 6, "question": "What is the 2's complement of 110100?", "options": ["001011", "001100", "110100", "More than one of the above", "None of the above"], "answer": "b", "explanation": "1's complement is 001011, add 1 to LSB = 001100."}, {"id": 7, "question": "For the binary number 100110, what is the 1's complement?", "options": ["011001", "100110", "011010", "More than one of the above", "None of the above"], "answer": "a", "explanation": "Invert bits of 100110 to get 011001 (1's complement)."}, {"id": 8, "question": "For the binary number 100110, what is the 2's complement?", "options": ["011001", "011010", "100110", "More than one of the above", "None of the above"], "answer": "b", "explanation": "Add 1 to 011001, gives 011010 (2's complement)."}, {"id": 9, "question": "What is the key difference between 1's complement and 2's complement?", "options": ["1's complement is found by inverting bits only", "2's complement adds 1 to the inverted bits", "2's complement represents negative numbers only", "More than one of the above", "None of the above"], "answer": "d", "explanation": "1's complement is inversion of bits; 2's complement is 1's complement plus 1."}, {"id": 10, "question": "What does the LSB stand for?", "options": ["Last Significant Bit", "Least Significant Bit", "Leading Significant Bit", "More than one of the above", "None of the above"], "answer": "b", "explanation": "LSB is the rightmost bit in a binary number."}, {"id": 11, "question": "Which of the following represents the 2's complement of 0000?", "options": ["1111", "0000", "0001", "More than one of the above", "None of the above"], "answer": "b", "explanation": "1's complement of 0000 is 1111, adding 1 results in 0000 (overflow discarded), so 2's complement of 0000 is 0000."}, {"id": 12, "question": "What is the 2's complement of the binary number 0011?", "options": ["1100", "1101", "1110", "More than one of the above", "None of the above"], "answer": "b", "explanation": "1's complement of 0011 is 1100; adding 1 gives 1101."}, {"id": 13, "question": "The 2's complement of binary 0101 is:", "options": ["1010", "1011", "1001", "More than one of the above", "None of the above"], "answer": "b", "explanation": "1's complement of 0101 is 1010, add 1 gives 1011."}, {"id": 14, "question": "If a binary number is 0110, its 2's complement is:", "options": ["1001", "1010", "0101", "More than one of the above", "None of the above"], "answer": "b", "explanation": "1's complement of 0110 is 1001, add 1 gives 1010."}, {"id": 15, "question": "What is the 2's complement of 1111?", "options": ["0000", "0001", "1110", "More than one of the above", "None of the above"], "answer": "b", "explanation": "1's complement of 1111 is 0000; adding 1 gives 0001."}, {"id": 16, "question": "Which statement is true about 2's complement?", "options": ["It simplifies binary subtraction", "It has only one zero representation", "Negative numbers are represented by 2's complement", "More than one of the above", "None of the above"], "answer": "d", "explanation": "2's complement simplifies subtraction, has a single zero representation, and is used to represent negative numbers."}, {"id": 17, "question": "What is the 1's complement of 0100?", "options": ["1011", "0111", "1000", "More than one of the above", "None of the above"], "answer": "a", "explanation": "1's complement flips 0 to 1 and 1 to 0, so 0100 becomes 1011."}, {"id": 18, "question": "What is the 2's complement of binary number 0100?", "options": ["1011", "1100", "1001", "More than one of the above", "None of the above"], "answer": "b", "explanation": "Add 1 to 1011 1100."}, {"id": 19, "question": "How many bits are changed when finding the 1's complement?", "options": ["Only the first bit", "All bits are inverted", "No bits change", "More than one of the above", "None of the above"], "answer": "b", "explanation": "1's complement inverts all bits."}, {"id": 20, "question": "Which of these binary numbers is its own 2's complement?", "options": ["0000", "1111", "1000", "More than one of the above", "None of the above"], "answer": "a", "explanation": "Only zero (0000) is its own 2's complement."}, {"id": 21, "question": "What is the 2's complement of binary number 0010?", "options": ["1110", "1101", "1111", "More than one of the above", "None of the above"], "answer": "a", "explanation": "1's complement of 0010 is 1101, add 1 gives 1110."}, {"id": 22, "question": "2's complement helps to:", "options": ["Simplify subtraction operation", "Represent positive and negative integers", "Detect overflow in binary addition", "More than one of the above", "None of the above"], "answer": "d", "explanation": "2's complement is used for subtraction, representing signed numbers, and overflow detection."}, {"id": 23, "question": "Which of the following numbers has the 2's complement 1010?", "options": ["0110", "0101", "0101", "More than one of the above", "None of the above"], "answer": "a", "explanation": "2's complement of 0110 is 1010."}, {"id": 24, "question": "To find the 2's complement of a number, after inverting the bits, you must:", "options": ["Add 0", "Add 1", "Add the MSB", "More than one of the above", "None of the above"], "answer": "b", "explanation": "Add 1 after inverting bits to get 2's complement."}, {"id": 25, "question": "Which of the following is false about 2's complement?", "options": ["It is used to represent negative numbers", "It has two representations of zero", "It simplifies binary arithmetic", "More than one of the above", "None of the above"], "answer": "b", "explanation": "This is false. 2's complement has only one zero representation."}, {"id": 26, "question": "What is the 2's complement of 0111?", "options": ["1000", "1001", "0111", "More than one of the above", "None of the above"], "answer": "a", "explanation": "1's complement of 0111 is 1000, add 1 gives 1000 (actually 1000, since 0111 1000 + 1 = 1000 due to overflow discarded)."}, {"id": 27, "question": "Which binary number represents -1 in 2's complement for a 4-bit system?", "options": ["1111", "0001", "1110", "More than one of the above", "None of the above"], "answer": "a", "explanation": "-1 in 2's complement (4-bit) is 1111."}, {"id": 28, "question": "What happens to the MSB after taking 2's complement of a positive number?", "options": ["It becomes 0", "It becomes 1", "It remains unchanged", "More than one of the above", "None of the above"], "answer": "a", "explanation": "MSB is 0 for positive numbers."}, {"id": 29, "question": "The 2's complement of binary number 1001 is:", "options": ["0110", "0111", "0101", "More than one of the above", "None of the above"], "answer": "b", "explanation": "1's complement of 1001 is 0110, add 1 gives 0111."}, {"id": 30, "question": "The binary number 1110 in 2's complement corresponds to which decimal number (4-", "options": ["+14", "-2", "-14", "More than one of the above", "None of the above"], "answer": "b", "explanation": "1110 in 4-bit 2's complement is -2."}], "Topic-2: Use of 2's Complement": [{"id": 31, "question": "How is the positive number +6 represented in a 5-bit register?", "options": ["1 1001", "0 0110", "1 0110", "0 1100", ""], "answer": "b", "explanation": "Positive numbers in 2's complement are represented as their normal binary equivalent with the MSB (sign bit) as 0. For +6 in 5 bits: `00110`."}, {"id": 32, "question": "How do you find the 2's complement of a binary number?", "options": ["Find 1's complement and subtract 1", "Find 1's complement and add 1", "Add 1 to the binary number", "Invert only the MSB", ""], "answer": "b", "explanation": "To get 2's complement, invert all bits (1's complement) and then add 1 to the least significant bit."}, {"id": 33, "question": "What is the 1's complement of the 5-bit binary number 0 0110?", "options": ["0 0110", "1 1001", "1 0110", "0 1001", ""], "answer": "b", "explanation": "Flip all bits: 0 1, 0 1, 1 0, 1 0, 0 1, so `00110` becomes `11001`."}, {"id": 34, "question": "What is the result after adding 1 to the LSB of 1 1001?", "options": ["1 1010", "1 1000", "0 0110", "1 1110", ""], "answer": "a", "explanation": "Adding 1 to `11001` results in `11010`."}, {"id": 35, "question": "What does the MSB ‘1’ indicate in the 2's complement number?", "options": ["Number is positive", "Number is negative", "Number is zero", "Number is ambiguous", ""], "answer": "b", "explanation": "In 2's complement, MSB = 1 means the number is negative."}, {"id": 36, "question": "How is the positive number +120 represented in an 8-bit register?", "options": ["1 0001000", "0 1111000", "1 1111000", "0 0001111", ""], "answer": "b", "explanation": "Positive numbers have MSB = 0 and rest are normal binary bits. 120 in binary is `1111000`, so 8-bit: `01111000`."}, {"id": 37, "question": "What is the 1's complement of the number 0 1111000 in 8-bit?", "options": ["1 1111000", "1 0000111", "0 0000111", "0 1111000", ""], "answer": "b", "explanation": "Flip all bits of `01111000` to get `10000111`."}, {"id": 38, "question": "What is the 2's complement of the number 0 1111000 after adding 1 to its 1's", "options": ["1 0000111", "0 1111001", "1 0001000", "0 1111000", ""], "answer": "c", "explanation": "Add 1 to `10000111`: `10000111 + 1 = 10001000`."}, {"id": 39, "question": "Why is 2's complement preferred over 1's complement in representing negative", "options": ["It is ambiguous", "It is unambiguous", "It uses fewer bits", "It does not require adding 1", ""], "answer": "b", "explanation": "1's complement has two zeros (positive and negative zero), causing ambiguity. 2's complement has only one zero, making it unambiguous."}, {"id": 40, "question": "What is the range of numbers that can be represented with a 5-bit 2's complement", "options": ["0 to 31", "-16 to 15", "-31 to 31", "-15 to 16", ""], "answer": "b", "explanation": "For n bits, range is from -2^(n-1) to 2^(n-1)-1. For 5 bits, -16 to 15."}, {"id": 41, "question": "Which of the following is true about 2's complement representation?", "options": ["It has two representations of zero", "Negative numbers have MSB = 1", "Positive numbers have MSB = 1", "It does not support subtraction", ""], "answer": "b", "explanation": "MSB = 1 indicates negative number; MSB = 0 indicates positive."}, {"id": 42, "question": "How do you represent -6 in 5-bit 2's complement?", "options": ["0 0110", "1 1001", "1 1010", "0 1001", ""], "answer": "c", "explanation": "+6 = `00110`, 1's complement: `11001`, add 1: `11010`."}, {"id": 43, "question": "In 2's complement subtraction, what operation is performed?", "options": ["Addition of 1's complement of the subtrahend", "Addition of 2's complement of the subtrahend", "Direct subtraction without complement", "Inversion of minuend", ""], "answer": "b", "explanation": "Subtraction is done by adding the 2's complement (negative form) of the number to be subtracted."}, {"id": 44, "question": "What is the 2's complement of 00001 (5-bit)?", "options": ["11111", "00001", "11110", "00010", ""], "answer": "a", "explanation": "1's complement of 00001 is 11110; adding 1 gives 11111."}, {"id": 45, "question": "If the 2's complement of a number is 10110 (5-bit), what is the original positive number?", "options": ["01010", "10110", "01001", "10101", ""], "answer": "a", "explanation": "The 2's complement of 10110 is 01010, so the positive magnitude is 01010."}, {"id": 46, "question": "When adding two 5-bit 2's complement numbers, what happens if there is an overflow?", "options": ["The result is always correct", "Overflow is ignored, and the result wraps around", "The system shows an error", "The MSB flips automatically", ""], "answer": "b", "explanation": "In fixed bit arithmetic, overflow causes wrapping of values."}, {"id": 47, "question": "How is zero represented in 2's complement?", "options": ["All bits 0", "All bits 1", "MSB = 1 and rest 0", "MSB = 0 and rest 1", ""], "answer": "a", "explanation": "Zero is represented as all zeros in 2's complement."}, {"id": 48, "question": "What is the main advantage of using 2's complement in arithmetic operations?", "options": ["Simplifies addition and subtraction", "Uses fewer bits", "Only represents positive numbers", "Eliminates need for MSB", ""], "answer": "a", "explanation": "2's complement allows subtraction to be performed as addition, simplifying hardware design."}, {"id": 49, "question": "How would you represent -1 in 5-bit 2's complement?", "options": ["00001", "11110", "11111", "00000", ""], "answer": "c", "explanation": "For -1, invert all bits of `00001` `11110` + 1 = `11111`."}, {"id": 50, "question": "In 2's complement, what is the binary representation of -120 using 8 bits?", "options": ["1 0000111", "0 1111000", "1 0001000", "0 0001000", ""], "answer": "c", "explanation": "+120 in 8-bit: `01111000` 1's complement: `10000111` Add 1: `10001000`."}]};
let qs=[],idx=0,answers={},reviewMode=false;
function showPage(id){['home','quiz','result'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}
function startTopic(name){qs=topics[name];idx=0;answers={};reviewMode=false;document.getElementById('topicTitle').textContent=name;showPage('quiz');render()}
function render(){
 const q=qs[idx];document.getElementById('progress').textContent='Question '+(idx+1)+' of '+qs.length;document.getElementById('question').textContent=q.question;
 const box=document.getElementById('options');box.innerHTML='';
 q.options.forEach((opt,i)=>{if(!opt)return;const letter='abcde'[i],btn=document.createElement('button');btn.className='option';btn.textContent=letter.toUpperCase()+') '+opt;if(answers[q.id]===letter)btn.classList.add('selected');if(reviewMode){btn.disabled=true;if(letter===q.answer)btn.classList.add('correct');if(answers[q.id]===letter&&letter!==q.answer)btn.classList.add('wrong')}else btn.onclick=()=>{answers[q.id]=letter;render()};box.appendChild(btn)});
 const ex=document.getElementById('explanation');if(reviewMode){ex.classList.remove('hidden');const ai='abcde'.indexOf(q.answer);ex.innerHTML='<b>Correct Answer: '+q.answer.toUpperCase()+') '+q.options[ai]+'</b><br><br><b>Explanation:</b> '+q.explanation}else ex.classList.add('hidden');
 const pal=document.getElementById('palette');pal.innerHTML='<b>Question Palette</b><br>';qs.forEach((item,i)=>{const b=document.createElement('button');b.textContent=i+1;if(answers[item.id])b.classList.add('done');b.onclick=()=>{idx=i;render()};pal.appendChild(b)});
}
function prevQ(){if(idx>0){idx--;render()}}function nextQ(){if(idx<qs.length-1){idx++;render()}}
function finish(){const attempted=Object.keys(answers).length,correct=qs.filter(q=>answers[q.id]===q.answer).length;document.getElementById('score').textContent='Score: '+correct+' / '+qs.length;document.getElementById('stats').textContent='Attempted: '+attempted+' | Correct: '+correct+' | Wrong: '+(attempted-correct)+' | Unattempted: '+(qs.length-attempted);showPage('result')}
function review(){reviewMode=true;idx=0;showPage('quiz');render()}function restart(){answers={};idx=0;reviewMode=false;showPage('quiz');render()}function goHome(){showPage('home')}
</script></body></html>
