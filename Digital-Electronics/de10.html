<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2's Complement MCQ Practice</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f4f6;margin:0;color:#1f2937}
.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#fff;padding:22px;border-radius:14px;box-shadow:0 2px 10px #0001;margin-bottom:16px}
.hidden{display:none}.topicBtn,.option{display:block;width:100%;text-align:left;padding:14px;margin:10px 0;background:#fff;border:1px solid #d1d5db;border-radius:9px;font-size:16px;cursor:pointer}
.selected{border:2px solid #2563eb;background:#eff6ff}.correct{background:#dcfce7;border-color:#16a34a}.wrong{background:#fee2e2;border-color:#dc2626}
button{padding:11px 16px;border:0;border-radius:8px;cursor:pointer;font-size:16px;margin:4px}.primary{background:#2563eb;color:#fff}.secondary{background:#e5e7eb}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.explain{margin-top:14px;padding:14px;background:#f8fafc;border-radius:8px;line-height:1.6}
#palette button{min-width:42px}.done{background:#bbf7d0}.muted{color:#6b7280}
</style>
</head>
<body><div class="wrap">
<div id="home" class="card"><h1>📚 2's Complement MCQ Practice</h1><p class="muted">Choose a topic and practice.</p><div id="topicList"></div></div>
<div id="quiz" class="hidden">
<div class="card top"><b id="progress"></b><b id="topicTitle"></b></div>
<div class="card"><h2 id="question"></h2><div id="options"></div><div id="explanation" class="hidden explain"></div></div>
<div class="card top"><div><button class="secondary" onclick="prevQ()">Previous</button><button class="primary" onclick="nextQ()">Next</button></div><div><button class="secondary" onclick="goHome()">Topics</button><button onclick="finish()">Submit Test</button></div></div>
<div id="palette" class="card"></div>
</div>
<div id="result" class="card hidden"><h1>🎯 Result</h1><h2 id="score"></h2><p id="stats"></p><button class="primary" onclick="review()">Review Answers & Explanations</button><button class="secondary" onclick="restart()">Try Again</button><button onclick="goHome()">Back to Topics</button></div>
</div>
<script>
const topics={"Topic-1: 2's Complement": [{"id": 1, "question": "What is the first step to find the 2's complement of a binary number?", "options": ["Add 1 to the number", "Find the 1's complement of the number", "Invert the number twice", "More than one of the above", "None of the above"], "answer": "b", "explanation": "The first step in finding the 2's complement is to find the 1's complement (invert all bits)."}, {"id": 2, "question": "How do you obtain the 2's complement after finding the 1's complement?", "options": ["Subtract 1 from the LSB", "Add 1 to the MSB", "Add 1 to the LSB", "More than one of the above", "None of the above"], "answer": "c", "explanation": "After obtaining the 1's complement, add 1 to the least significant bit (LSB) to get the 2's complement."}, {"id": 3, "question": "What is the 2's complement of binary number 1011001?", "options": ["0100110", "0100111", "1011001", "More than one of the above", "None of the above"], "answer": "b", "explanation": "1's complement of 1011001 is 0100110, adding 1 gives 0100111."}, {"id": 4, "question": "Which logic gates are commonly used to implement the 2's complement circuit?", "options": ["AND, OR, NOT", "XOR, NAND, NOR", "OR, XOR, NOT", "More than one of the above", "None of the above"], "answer": "a", "explanation": "The 2's complement logic circuit can be designed using these gates to invert bits and add 1."}, {"id": 5, "question": "What is the 1's complement of the binary number 110100?", "options": ["110011", "001011", "001100", "More than one of the above", "None of the above"], "answer": "b", "explanation": "1's complement flips all bits of 110100 to 001011."}, {"id": 6, "question": "What is the 2's complement of 110100?", "options": ["001011", "001100", "110100", "More than one of the above", "None of the above"], "answer": "b", "explanation": "1's complement is 001011, add 1 to LSB = 001100."}, {"id": 7, "question": "For the binary number 100110, what is the 1's complement?", "options": ["011001", "100110", "011010", "More than one of the above", "None of the above"], "answer": "a", "explanation": "Invert bits of 100110 to get 011001 (1's complement)."}, {"id": 8, "question": "For the binary number 100110, what is the 2's complement?", "options": ["011001", "011010", "100110", "More than one of the above", "None of the above"], "answer": "b", "explanation": "Add 1 to 011001, gives 011010 (2's complement)."}, {"id": 9, "question": "What is the key difference between 1's complement and 2's complement?", "options": ["1's complement is found by inverting bits only", "2's complement adds 1 to the inverted bits", "2's complement represents negative numbers only", "More than one of the above", "None of the above"], "answer": "d", "explanation": "1's complement is inversion of bits; 2's complement is 1's complement plus 1."}, {"id": 10, "question": "What does the LSB stand for?", "options": ["Last Significant Bit", "Least Significant Bit", "Leading Significant Bit", "More than one of the above", "None of the above"], "answer": "b", "explanation": "LSB is the rightmost bit in a binary number."}, {"id": 11, "question": "Which of the following represents the 2's complement of 0000?", "options": ["1111", "0000", "0001", "More than one of the above", "None of the above"], "answer": "b", "explanation": "1's complement of 0000 is 1111, adding 1 results in 0000 (overflow discarded), so 2's complement of 0000 is 0000."}, {"id": 12, "question": "What is the 2's complement of the binary number 0011?", "options": ["1100", "1101", "1110", "More than one of the above", "None of the above"], "answer": "b", "explanation": "1's complement of 0011 is 1100; adding 1 gives 1101."}, {"id": 13, "question": "The 2's complement of binary 0101 is:", "options": ["1010", "1011", "1001", "More than one of the above", "None of the above"], "answer": "b", "explanation": "1's complement of 0101 is 1010, add 1 gives 1011."}, {"id": 14, "question": "If a binary number is 0110, its 2's complement is:", "options": ["1001", "1010", "0101", "More than one of the above", "None of the above"], "answer": "b", "explanation": "1's complement of 0110 is 1001, add 1 gives 1010."}, {"id": 15, "question": "What is the 2's complement of 1111?", "options": ["0000", "0001", "1110", "More than one of the above", "None of the above"], "answer": "b", "explanation": "1's complement of 1111 is 0000; adding 1 gives 0001."}, {"id": 16, "question": "Which statement is true about 2's complement?", "options": ["It simplifies binary subtraction", "It has only one zero representation", "Negative numbers are represented by 2's complement", "More than one of the above", "None of the above"], "answer": "d", "explanation": "2's complement simplifies subtraction, has a single zero representation, and is used to represent negative numbers."}, {"id": 17, "question": "What is the 1's complement of 0100?", "options": ["1011", "0111", "1000", "More than one of the above", "None of the above"], "answer": "a", "explanation": "1's complement flips 0 to 1 and 1 to 0, so 0100 becomes 1011."}, {"id": 18, "question": "What is the 2's complement of binary number 0100?", "options": ["1011", "1100", "1001", "More than one of the above", "None of the above"], "answer": "b", "explanation": "Add 1 to 1011 1100."}, {"id": 19, "question": "How many bits are changed when finding the 1's complement?", "options": ["Only the first bit", "All bits are inverted", "No bits change", "More than one of the above", "None of the above"], "answer": "b", "explanation": "1's complement inverts all bits."}, {"id": 20, "question": "Which of these binary numbers is its own 2's complement?", "options": ["0000", "1111", "1000", "More than one of the above", "None of the above"], "answer": "a", "explanation": "Only zero (0000) is its own 2's complement."}, {"id": 21, "question": "What is the 2's complement of binary number 0010?", "options": ["1110", "1101", "1111", "More than one of the above", "None of the above"], "answer": "a", "explanation": "1's complement of 0010 is 1101, add 1 gives 1110."}, {"id": 22, "question": "2's complement helps to:", "options": ["Simplify subtraction operation", "Represent positive and negative integers", "Detect overflow in binary addition", "More than one of the above", "None of the above"], "answer": "d", "explanation": "2's complement is used for subtraction, representing signed numbers, and overflow detection."}, {"id": 23, "question": "Which of the following numbers has the 2's complement 1010?", "options": ["0110", "0101", "0101", "More than one of the above", "None of the above"], "answer": "a", "explanation": "2's complement of 0110 is 1010."}, {"id": 24, "question": "To find the 2's complement of a number, after inverting the bits, you must:", "options": ["Add 0", "Add 1", "Add the MSB", "More than one of the above", "None of the above"], "answer": "b", "explanation": "Add 1 after inverting bits to get 2's complement."}, {"id": 25, "question": "Which of the following is false about 2's complement?", "options": ["It is used to represent negative numbers", "It has two representations of zero", "It simplifies binary arithmetic", "More than one of the above", "None of the above"], "answer": "b", "explanation": "This is false. 2's complement has only one zero representation."}, {"id": 26, "question": "What is the 2's complement of 0111?", "options": ["1000", "1001", "0111", "More than one of the above", "None of the above"], "answer": "a", "explanation": "1's complement of 0111 is 1000, add 1 gives 1000 (actually 1000, since 0111 1000 + 1 = 1000 due to overflow discarded)."}, {"id": 27, "question": "Which binary number represents -1 in 2's complement for a 4-bit system?", "options": ["1111", "0001", "1110", "More than one of the above", "None of the above"], "answer": "a", "explanation": "-1 in 2's complement (4-bit) is 1111."}, {"id": 28, "question": "What happens to the MSB after taking 2's complement of a positive number?", "options": ["It becomes 0", "It becomes 1", "It remains unchanged", "More than one of the above", "None of the above"], "answer": "a", "explanation": "MSB is 0 for positive numbers."}, {"id": 29, "question": "The 2's complement of binary number 1001 is:", "options": ["0110", "0111", "0101", "More than one of the above", "None of the above"], "answer": "b", "explanation": "1's complement of 1001 is 0110, add 1 gives 0111."}, {"id": 30, "question": "The binary number 1110 in 2's complement corresponds to which decimal number (4-", "options": ["+14", "-2", "-14", "More than one of the above", "None of the above use of 2's complement with examples: ### 31. How is the positive number +6 represented in a 5-bit register?"], "answer": "b", "explanation": "1110 in 4-bit 2's complement is -2."}], "Topic-2: Use of 2's Complement": []};
let qs=[],idx=0,ans={},reviewMode=false,currentTopic="";

function show(id){["home","quiz","result"].forEach(x=>document.getElementById(x).classList.add("hidden"));document.getElementById(id).classList.remove("hidden")}
function renderTopics(){
 const box=document.getElementById("topicList");box.innerHTML="";
 Object.keys(topics).forEach(name=>{
  const b=document.createElement("button");b.className="topicBtn";
  b.textContent=name+" ("+topics[name].length+" Questions)";
  b.onclick=()=>startTopic(name);box.appendChild(b);
 });
}
function startTopic(name){currentTopic=name;qs=topics[name];idx=0;ans={};reviewMode=false;document.getElementById("topicTitle").textContent=name;show("quiz");render()}
function render(){
 const q=qs[idx];if(!q)return;
 document.getElementById("progress").textContent="Question "+(idx+1)+" of "+qs.length;
 document.getElementById("question").textContent=q.question;
 const box=document.getElementById("options");box.innerHTML="";
 q.options.forEach((o,i)=>{
  const l="abcde"[i],b=document.createElement("button");
  b.className="option"+(ans[q.id]===l?" selected":"");
  b.textContent=l.toUpperCase()+") "+o;
  if(reviewMode){b.disabled=true;if(l===q.answer)b.classList.add("correct");if(ans[q.id]===l&&l!==q.answer)b.classList.add("wrong")}
  else b.onclick=()=>{ans[q.id]=l;render()};
  box.appendChild(b);
 });
 const ex=document.getElementById("explanation");
 if(reviewMode){const ai="abcde".indexOf(q.answer);ex.classList.remove("hidden");ex.innerHTML="<b>Correct Answer: "+q.answer.toUpperCase()+") "+q.options[ai]+"</b><br><br><b>Explanation:</b> "+(q.explanation||"Not available.");}
 else ex.classList.add("hidden");
 const p=document.getElementById("palette");p.innerHTML="<b>Question Palette</b><br>";
 qs.forEach((x,i)=>{const b=document.createElement("button");b.textContent=i+1;if(ans[x.id])b.classList.add("done");b.onclick=()=>{idx=i;render()};p.appendChild(b)});
}
function prevQ(){if(idx>0){idx--;render()}}
function nextQ(){if(idx<qs.length-1){idx++;render()}}
function finish(){
 if(!confirm("Submit your test?"))return;
 const correct=qs.filter(q=>ans[q.id]===q.answer).length,attempted=Object.keys(ans).length;
 document.getElementById("score").textContent="Score: "+correct+" / "+qs.length;
 document.getElementById("stats").textContent="Attempted: "+attempted+" | Correct: "+correct+" | Wrong: "+(attempted-correct)+" | Unattempted: "+(qs.length-attempted);
 show("result");
}
function review(){reviewMode=true;idx=0;show("quiz");render()}
function restart(){ans={};idx=0;reviewMode=false;show("quiz");render()}
function goHome(){show("home");renderTopics()}
renderTopics();
</script></body></html>
