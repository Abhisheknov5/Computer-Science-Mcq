es", "More than one of the above", "None of the above"], "answer": "d", "explanation": "See the correct answer for this question."}, {"id": 78, "question": "In a convolutional code, what does the \"constraint length\" refer to?", "options": ["The number of data bits processed at a time", "The maximum length of the memory register", "The total number of codewords generated", "More than one of the above", "None of the above"], "answer": "b", "explanation": "See the correct answer for this question."}, {"id": 79, "question": "What does the output of a convolutional encoder depend on?", "options": ["Only the current input bit", "The current input and previous input bits", "The current and future input bits", "More than one of the above", "None of the above"], "answer": "b", "explanation": "See the correct answer for this question."}, {"id": 80, "question": "In convolutional coding, what is the role of the shift register?", "options": ["To store input data and generate encoded output", "To correct errors during transmission", "To increase the error-detection capability", "More than one of the above", "None of the above"], "answer": "a", "explanation": "See the correct answer for this question."}]}]; let currentTopic=null,qs=[],idx=0,ans={},reviewMode=false;
function loadTopics(){const box=document.getElementById('topics');box.innerHTML='';topics.forEach(t=>{let b=document.createElement('button');b.className='topic';b.innerHTML='<b>Topic '+t.id+'</b><br><br>'+t.name+'<br><small>'+t.questions.length+' Questions</small>';b.onclick=()=>start(t.id);box.appendChild(b)})}
function start(id){currentTopic=topics.find(t=>t.id===id);qs=currentTopic.questions;idx=0;ans={};reviewMode=false;document.getElementById('home').classList.add('hidden');document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');document.getElementById('topicTitle').textContent='Topic '+currentTopic.id+': '+currentTopic.name;render()}
function render(){let q=qs[idx];document.getElementById('progress').textContent='Question '+(idx+1)+' of '+qs.length;document.getElementById('question').textContent=q.question;let box=document.getElementById('options');box.innerHTML='';q.options.forEach((o,i)=>{let l='abcde'[i],b=document.createElement('button');b.className='option'+(ans[q.id]===l?' selected':'');b.textContent=l.toUpperCase()+') '+o;if(reviewMode){b.disabled=true;if(l===q.answer)b.classList.add('correct');if(ans[q.id]===l&&l!==q.answer)b.classList.add('wrong')}else b.onclick=()=>{ans[q.id]=l;render()};box.appendChild(b)});let ex=document.getElementById('explanation');if(reviewMode){ex.classList.remove('hidden');ex.innerHTML='<b>Correct Answer: '+q.answer.toUpperCase()+') '+q.options['abcde'.indexOf(q.answer)]+'</b><br><br><b>Explanation:</b> '+q.explanation}else ex.classList.add('hidden');let p=document.getElementById('palette');p.innerHTML='<b>Question Palette</b><br>';qs.forEach((x,i)=>{let b=document.createElement('button');b.textContent=x.id;if(ans[x.id])b.classList.add('done');b.onclick=()=>{idx=i;render()};p.appendChild(b)})}
function prev(){if(idx>0){idx--;render()}}function next(){if(idx<qs.length-1){idx++;render()}}
function finish(){if(!confirm('Submit your test?'))return;document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');let correct=qs.filter(q=>ans[q.id]===q.answer).length,attempted=Object.keys(ans).length;document.getElementById('score').textContent='Score: '+correct+' / '+qs.length;document.getElementById('stats').textContent='Attempted: '+attempted+' | Correct: '+correct+' | Wrong: '+(attempted-correct)+' | Unattempted: '+(qs.length-attempted)}
function review(){reviewMode=true;document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');idx=0;render()}function restart(){start(currentTopic.id)}function goHome(){document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.add('hidden');document.getElementById('home').classList.remove('hidden')}loadTopics();
</script></body></html>
