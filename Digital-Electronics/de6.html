let idx=0, ans={}, reviewMode=false;

function render(){
  const q=qs[idx];
  document.getElementById('progress').textContent=`Question ${idx+1} of ${qs.length}`;
  document.getElementById('question').textContent=q.question;

  const box=document.getElementById('options');
  box.innerHTML='';

  q.options.forEach((o,i)=>{
    const l='abcde'[i];
    const b=document.createElement('button');
    b.className='option'+(ans[q.id]===l?' selected':'');
    b.textContent=l.toUpperCase()+') '+o;

    if(reviewMode){
      b.disabled=true;
      if(l===q.answer)b.classList.add('correct');
      if(ans[q.id]===l && l!==q.answer)b.classList.add('wrong');
    }else{
      b.onclick=()=>{ans[q.id]=l;render();};
    }
    box.appendChild(b);
  });

  const ex=document.getElementById('explanation');
  if(reviewMode){
    ex.classList.remove('hidden');
    ex.innerHTML='<b>Correct Answer: '+q.answer.toUpperCase()+') '+q.options['abcde'.indexOf(q.answer)]+'</b><br><br><b>Explanation:</b> '+q.explanation;
  }else{
    ex.classList.add('hidden');
  }

  const p=document.getElementById('palette');
  p.innerHTML='<b>Question Palette</b><br>';
  qs.forEach((x,i)=>{
    const b=document.createElement('button');
    b.textContent=i+1;
    if(ans[x.id])b.classList.add('done');
    b.onclick=()=>{idx=i;render();};
    p.appendChild(b);
  });
}

function prev(){if(idx>0){idx--;render();}}
function next(){if(idx<qs.length-1){idx++;render();}}

function finish(){
  if(!confirm('Submit your test?'))return;
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');

  const correct=qs.filter(q=>ans[q.id]===q.answer).length;
  const attempted=Object.keys(ans).length;
  document.getElementById('score').textContent=`Score: ${correct} / ${qs.length}`;
  document.getElementById('stats').textContent=`Attempted: ${attempted} | Correct: ${correct} | Wrong: ${attempted-correct} | Unattempted: ${qs.length-attempted}`;
}

function review(){
  reviewMode=true;
  document.getElementById('result').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  idx=0;
  render();
}

render();
</script>
