
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Number System MCQ Practice</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#1f2937}.wrap{max-width:900px;margin:auto;padding:20px}
.card{background:#fff;padding:22px;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.08);margin-bottom:16px}
button,select{padding:11px 16px;border:0;border-radius:9px;font-size:16px;cursor:pointer}.primary{background:#2563eb;color:#fff}.secondary{background:#e5e7eb}
.topic{display:block;width:100%;text-align:left;margin:10px 0;background:#f8fafc;border:1px solid #d1d5db}
.option{display:block;width:100%;text-align:left;padding:14px;margin:10px 0;background:#fff;border:1px solid #d1d5db;border-radius:10px;font-size:16px}
.selected{border:2px solid #2563eb;background:#eff6ff}.correct{background:#dcfce7;border-color:#16a34a}.wrong{background:#fee2e2;border-color:#dc2626}
.hidden{display:none}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}#palette button{min-width:42px;margin:4px}.done{background:#bbf7d0}.current{outline:3px solid #2563eb}.small{color:#6b7280}
</style></head><body><div class="wrap">
<div id="home" class="card"><h1>📚 Number System MCQ Practice</h1><p class="small">40 MCQs | 4 Topics</p><div id="topicList"></div></div>
<div id="setup" class="card hidden"><button class="secondary" onclick="home()">← Back</button><h2 id="topicName"></h2><p class="small" id="topicInfo"></p><label>Questions: <select id="count"></select></label><br><br><button class="primary" onclick="start()">Start Practice</button></div>
<div id="quiz" class="hidden"><div class="card top"><b id="progress"></b><b id="attempted"></b></div><div class="card"><h2 id="question"></h2><div id="options"></div></div><div class="card top"><div><button class="secondary" onclick="prev()">Previous</button><button class="primary" onclick="next()">Next</button></div><button class="primary" onclick="finish()">Submit Test</button></div><div id="palette" class="card"></div></div>
<div id="result" class="card hidden"><h1>🎯 Result</h1><h2 id="score"></h2><p id="stats"></p><button class="primary" onclick="review()">Review Answers</button><button class="secondary" onclick="home()">Choose Topic</button></div>
</div><script>
const topics=[{"name": "Binary Number System", "questions": [{"id": 1, "question": "Binary number system uses how many digits?", "options": ["10", "8", "2", "More than one of the above", "None of the above"], "answer": "c"}, {"id": 2, "question": "What is the base of the binary number system?", "options": ["8", "10", "2", "More than one of the above", "None of the above"], "answer": "c"}, {"id": 3, "question": "What is the binary equivalent of decimal 5?", "options": ["101", "110", "111", "More than one of the above", "None of the above"], "answer": "a"}, {"id": 4, "question": "A nibble consists of how many bits?", "options": ["4", "8", "2", "More than one of the above", "None of the above"], "answer": "a"}, {"id": 5, "question": "What is the binary value of decimal 13?", "options": ["1101", "1001", "1011", "More than one of the above", "None of the above"], "answer": "a"}, {"id": 6, "question": "Binary number 1111 is equal to which decimal value?", "options": ["15", "16", "14", "More than one of the above", "None of the above"], "answer": "a"}, {"id": 7, "question": "Binary system is commonly used in:", "options": ["Digital Computers", "Calculators", "Watches", "More than one of the above", "None of the above"], "answer": "a"}, {"id": 8, "question": "Each digit in binary is called a:", "options": ["Byte", "Bit", "Word", "More than one of the above", "None of the above"], "answer": "b"}, {"id": 9, "question": "Which base power is used in binary numbers?", "options": ["10", "16", "2", "More than one of the above", "None of the above"], "answer": "c"}, {"id": 10, "question": "Binary number 1000 is equivalent to which decimal number?", "options": ["8", "10", "4", "More than one of the above", "None of the above"], "answer": "a"}]}, {"name": "Decimal Number System", "questions": [{"id": 11, "question": "What is the base of the decimal number system?", "options": ["2", "8", "10", "More than one of the above", "None of the above"], "answer": "c"}, {"id": 12, "question": "Decimal number system uses how many digits?", "options": ["2", "10", "8", "More than one of the above", "None of the above"], "answer": "b"}, {"id": 13, "question": "Which digit is not part of the decimal system?", "options": ["5", "9", "A", "More than one of the above", "None of the above"], "answer": "c"}, {"id": 14, "question": "What is the decimal value of (2×10²) + (5×10¹) + (1×10⁰)?", "options": ["251", "215", "521", "More than one of the above", "None of the above"], "answer": "a"}, {"id": 15, "question": "Decimal system is also called:", "options": ["Base 8", "Base 2", "Base 10", "More than one of the above", "None of the above"], "answer": "c"}, {"id": 16, "question": "Which of the following is a valid decimal number?", "options": ["128", "456", "739", "More than one of the above", "None of the above"], "answer": "d"}, {"id": 17, "question": "Decimal system is mostly used in:", "options": ["Human Counting", "Digital Systems", "Boolean Algebra", "More than one of the above", "None of the above"], "answer": "a"}, {"id": 18, "question": "The rightmost digit in decimal has what power of 10?", "options": ["1", "10", "0", "More than one of the above", "None of the above"], "answer": "c"}, {"id": 19, "question": "The number 3021 is read as:", "options": ["Three thousand twenty-one", "Thirty twenty-one", "Three two one", "More than one of the above", "None of the above"], "answer": "a"}, {"id": 20, "question": "Decimal number 100 is equal to:", "options": ["10²", "10³", "10¹", "More than one of the above", "None of the above"], "answer": "a"}]}, {"name": "Octal Number System", "questions": [{"id": 21, "question": "What is the base of the octal number system?", "options": ["2", "8", "16", "More than one of the above", "None of the above"], "answer": "b"}, {"id": 22, "question": "How many digits are there in the octal number system?", "options": ["10", "8", "16", "More than one of the above", "None of the above"], "answer": "b"}, {"id": 23, "question": "Which of the following is an invalid octal number?", "options": ["234", "756", "876", "More than one of the above", "None of the above"], "answer": "c"}, {"id": 24, "question": "The digit 8 is used in octal system?", "options": ["Yes", "No", "Sometimes", "More than one of the above", "None of the above"], "answer": "b"}, {"id": 25, "question": "Octal number 7 corresponds to which binary number?", "options": ["111", "011", "000", "More than one of the above", "None of the above"], "answer": "a"}, {"id": 26, "question": "What is the octal equivalent of binary 110?", "options": ["6", "4", "2", "More than one of the above", "None of the above"], "answer": "a"}, {"id": 27, "question": "A group of how many binary digits can be represented as one octal digit?", "options": ["2", "3", "4", "More than one of the above", "None of the above"], "answer": "b"}, {"id": 28, "question": "What is the octal representation of decimal number 8?", "options": ["10", "11", "12", "More than one of the above", "None of the above"], "answer": "a"}, {"id": 29, "question": "Which of the following octal numbers is correct?", "options": ["567", "982", "849", "More than one of the above", "None of the above"], "answer": "a"}, {"id": 30, "question": "Octal number 77 is equal to decimal:", "options": ["63", "56", "49", "More than one of the above", "None of the above"], "answer": "a"}]}, {"name": "Hexadecimal Number System", "questions": [{"id": 31, "question": "What is the base of the hexadecimal number system?", "options": ["16", "10", "2", "More than one of the above", "None of the above"], "answer": "a"}, {"id": 32, "question": "How many unique symbols are used in hexadecimal?", "options": ["10", "16", "8", "More than one of the above", "None of the above"], "answer": "b"}, {"id": 33, "question": "What digit comes after 9 in hexadecimal?", "options": ["A", "10", "B", "More than one of the above", "None of the above"], "answer": "a"}, {"id": 34, "question": "What is the hexadecimal equivalent of decimal 15?", "options": ["F", "E", "D", "More than one of the above", "None of the above"], "answer": "a"}, {"id": 35, "question": "Which of the following is a valid hexadecimal number?", "options": ["1A2F", "93G4", "123Z", "More than one of the above", "None of the above"], "answer": "a"}, {"id": 36, "question": "A group of how many binary digits can be represented as one hexadecimal digit?", "options": ["2", "4", "8", "More than one of the above", "None of the above"], "answer": "b"}, {"id": 37, "question": "Which of the following letters are used in hexadecimal system?", "options": ["A to F", "G to L", "M to Z", "More than one of the above", "None of the above"], "answer": "a"}, {"id": 38, "question": "What is the hexadecimal of binary 1111?", "options": ["F", "E", "D", "More than one of the above", "None of the above"], "answer": "a"}, {"id": 39, "question": "Hexadecimal number 1A is equal to which decimal value?", "options": ["26", "27", "25", "More than one of the above", "None of the above"], "answer": "a"}, {"id": 40, "question": "Hexadecimal number system is widely used in:", "options": ["Memory Addressing", "Image Processing", "Music Production", "More than one of the above", "None of the above"], "answer": "a"}]}];let selected=null,quiz=[],idx=0,answers={},reviewMode=false;
function show(id){['home','setup','quiz','result'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}
function home(){show('home')}
function renderTopics(){let b=document.getElementById('topicList');b.innerHTML='';topics.forEach((t,i)=>{let x=document.createElement('button');x.className='topic';x.innerHTML='<b>'+t.name+'</b><br><span class="small">'+t.questions.length+' Questions</span>';x.onclick=()=>choose(i);b.appendChild(x)})}
function choose(i){selected=topics[i];document.getElementById('topicName').textContent=selected.name;document.getElementById('topicInfo').textContent=selected.questions.length+' MCQs available';let s=document.getElementById('count');s.innerHTML='';[5,10].filter(n=>n<=selected.questions.length).forEach(n=>{let o=document.createElement('option');o.value=n;o.textContent=n;s.appendChild(o)});s.value=selected.questions.length;show('setup')}
function shuffle(a){return [...a].sort(()=>Math.random()-0.5)}
function start(){quiz=shuffle(selected.questions);idx=0;answers={};reviewMode=false;show('quiz');render()}
function render(){let q=quiz[idx];document.getElementById('progress').textContent=selected.name+' | Question '+(idx+1)+' of '+quiz.length;document.getElementById('attempted').textContent='Attempted: '+Object.keys(answers).length+'/'+quiz.length;let box=document.getElementById('options');document.getElementById('question').textContent=q.question;box.innerHTML='';q.options.forEach((o,i)=>{let l='abcde'[i],b=document.createElement('button');b.className='option'+(answers[q.id]===l?' selected':'');b.textContent=l.toUpperCase()+') '+o;if(reviewMode){b.disabled=true;if(l===q.answer)b.classList.add('correct');if(answers[q.id]===l&&l!==q.answer)b.classList.add('wrong')}else b.onclick=()=>{answers[q.id]=l;render()};box.appendChild(b)});let p=document.getElementById('palette');p.innerHTML='<b>Question Palette</b><br>';quiz.forEach((x,i)=>{let b=document.createElement('button');b.textContent=i+1;if(answers[x.id])b.classList.add('done');if(i===idx)b.classList.add('current');b.onclick=()=>{idx=i;render()};p.appendChild(b)})}
function prev(){if(idx>0){idx--;render()}}function next(){if(idx<quiz.length-1){idx++;render()}}
function finish(){if(!confirm('Submit your test?'))return;let correct=quiz.filter(q=>answers[q.id]===q.answer).length,attempted=Object.keys(answers).length;document.getElementById('score').textContent='Score: '+correct+' / '+quiz.length;document.getElementById('stats').textContent='Attempted: '+attempted+' | Correct: '+correct+' | Wrong: '+(attempted-correct)+' | Unattempted: '+(quiz.length-attempted);show('result')}
function review(){reviewMode=true;idx=0;show('quiz');render()}renderTopics();
</script></body></html>
