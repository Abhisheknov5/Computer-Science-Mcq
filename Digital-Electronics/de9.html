<style>

<body>

<script>
const topics={"Basic Concepts of 1's Complement": [{"id": 1, "question": "What is the 1's complement of the binary number 1011001?", "options": ["1011001", "0100110", "1100110", "More than one of the above", "None of the above"], "answer": "b", "explanation": "1's complement is found by inverting each bit: 1\n0 and 0\n1.\n\n---"}, {"id": 2, "question": "Which logic gate is primarily used to find the 1's complement of a binary number?", "options": ["AND", "OR", "NOT", "More than one of the above", "None of the above"], "answer": "c", "explanation": "The NOT gate inverts each bit, giving the 1's complement.\n\n---"}, {"id": 3, "question": "How many NOT gates are required to find the 1's complement of a 6-bit binary number?", "options": ["1", "3", "6", "More than one of the above", "None of the above"], "answer": "c", "explanation": "Each bit requires one NOT gate for inversion.\n\n---"}, {"id": 4, "question": "What does the 1's complement of a binary number represent in digital electronics?", "options": ["Positive decimal number", "Negative decimal number", "Both positive and negative", "More than one of the above", "None of the above"], "answer": "b", "explanation": "1's complement is used to represent negative numbers by inverting bits of the\npositive binary number.\n\n---"}, {"id": 5, "question": "The 1's complement of the binary number 11010.1101 is:", "options": ["11010.1101", "00101.0010", "11111.1111", "More than one of the above", "None of the above"], "answer": "b", "explanation": "Each bit, including fractional part, is inverted.\n\n---"}, {"id": 6, "question": "What is the 1's complement of 100110.1001?", "options": ["100110.1001", "011001.0110", "111111.1111", "More than one of the above", "None of the above"], "answer": "b", "explanation": "Invert each bit of both integer and fractional parts.\n\n---"}, {"id": 7, "question": "To find the 1's complement of a binary number, what operation is performed on each bit?", "options": ["Replace 0 with 1 and 1 with 0", "Add 1 to the least significant bit", "Shift bits to the right", "More than one of the above", "None of the above"], "answer": "a", "explanation": "This is the definition of 1's complement.\n\n---"}, {"id": 8, "question": "The 2's complement of a binary number is obtained by:", "options": ["Inverting all bits only", "Adding 1 to the inverted bits", "Shifting bits to the left", "More than one of the above", "None of the above"], "answer": "b", "explanation": "2's complement = 1's complement + 1.\n\n---"}, {"id": 9, "question": "Which of the following correctly represents the 2's complement of 1011001?", "options": ["0100110", "0100111", "1011001", "More than one of the above", "None of the above"], "answer": "b", "explanation": "1's complement is 0100110, plus 1 = 0100111.\n\n---"}, {"id": 10, "question": "What is the main difference between 1's and 2's complement?", "options": ["1's complement involves bit inversion only", "2's complement involves bit inversion and addition of 1", "Both are same", "More than one of the above", "None of the above"], "answer": "b", "explanation": "Each bit, including fractional part, is inverted.\n\n---\n\n### 6. What is the 1's complement of 100110.1001?\n\nAnswer: b) 011001.0110\nExplanation: Invert each bit of both integer and fractional parts.\n\n---\n\n### 7. To find the 1's complement of a binary number, what operation is performed on each\nbit?\n\nAnswer: a) Replace 0 with 1 and 1 with 0\nExplanation: This is the definition of 1's complement.\n\n---\n\n### 8. The 2's complement of a binary number is obtained by:\n\nAnswer: b) Adding 1 to the inverted bits\n\nExplanation: 2's complement = 1's complement + 1.\n\n---\n\n### 9. Which of the following correctly represents the 2's complement of 1011001?\n\nAnswer: b) 0100111\nExplanation: 1's complement is 0100110, plus 1 = 0100111.\n\n---\n\n### 10. What is the main difference between 1's and 2's complement?\n\nAnswer: d) More than one of the above\nExplanation: 1's complement involves only inversion; 2's complement involves inversion plus\naddition of 1.\n\n---"}, {"id": 11, "question": "What is the 1's complement of binary number 0011 according to the table?", "options": ["0011", "1100", "1111", "More than one of the above", "None of the above"], "answer": "d", "explanation": "1's complement involves only inversion; 2's complement involves inversion plus\naddition of 1.\n\n---\n\n### 11. What is the 1's complement of binary number 0011 according to the table?\n\nAnswer: b) 1100\nExplanation: 0\n1, 1\n0 gives 1100.\n\n---"}, {"id": 12, "question": "According to the 1's complement table, what is the 1's complement of 0101?", "options": ["1010", "0101", "1111", "More than one of the above", "None of the above"], "answer": "a", "explanation": "Invert each bit.\n\n---"}, {"id": 13, "question": "In the 1's complement table, which binary number's complement is 1001?", "options": ["0110", "1001", "0101", "More than one of the above", "None of the above"], "answer": "a", "explanation": "1's complement of 0110 is 1001.\n\n---"}, {"id": 14, "question": "How can the 1's complement operation be implemented in hardware?", "options": ["Using AND gates", "Using OR gates", "Using NOT gates on each bit", "More than one of the above", "None of the above"], "answer": "c", "explanation": "Each bit is inverted using a NOT gate.\n\n---"}, {"id": 15, "question": "To implement 1's complement for an 8-bit binary number, how many NOT gates are required?", "options": ["4", "6", "8", "More than one of the above", "None of the above"], "answer": "c", "explanation": "One NOT gate per bit.\n\n---"}, {"id": 16, "question": "What is the effect of 1's complement on the sign of a binary number?", "options": ["It makes the number positive", "It makes the number negative", "It does not affect the sign", "More than one of the above", "None of the above"], "answer": "b", "explanation": "1's complement is used to represent negative numbers by bit inversion.\n\n---"}, {"id": 17, "question": "If a number in 1's complement system has all bits as 1, what decimal number does it", "options": ["0", "-0", "1", "More than one of the above", "None of the above"], "answer": "b", "explanation": "In 1's complement, all 1s represent negative zero, distinct from positive zero.\n\n---"}, {"id": 18, "question": "Which of the following represents the negative binary number in 1's complement form?", "options": ["Original binary number", "Bitwise inverted number", "Number plus 1", "More than one of the above", "None of the above"], "answer": "b", "explanation": "Negative number is represented by inverting all bits of the positive number.\n\n---"}, {"id": 19, "question": "What is the 1's complement of the binary number 1111?", "options": ["0000", "1111", "1000", "More than one of the above", "None of the above"], "answer": "a", "explanation": "Invert all bits.\n\n---"}, {"id": 20, "question": "What is the decimal equivalent of the 1's complement of 0001?", "options": ["1", "-1", "0", "More than one of the above", "None of the above"], "answer": "b", "explanation": "0001 is +1; its 1's complement 1110 represents -1 in signed binary.\n\n---"}, {"id": 21, "question": "Which of the following is true about 1's complement representation?", "options": ["It has two representations of zero", "It has only one representation of zero", "It cannot represent negative numbers", "More than one of the above", "None of the above"], "answer": "a", "explanation": "0000 = +0 and 1111 = -0 are both zeros.\n\n---"}, {"id": 22, "question": "Which operation can be simplified using 1's complement?", "options": ["Addition", "Subtraction", "Multiplication", "More than one of the above", "None of the above"], "answer": "b", "explanation": "Subtraction can be done by adding 1's complement (negation).\n\n---"}, {"id": 23, "question": "If the 1's complement of a number is 1110, what is the original binary number?", "options": ["0001", "1110", "0010", "More than one of the above", "None of the above"], "answer": "a", "explanation": "Invert bits of 1110 to get 0001.\n\n---"}, {"id": 24, "question": "Which of the following can represent the same negative decimal number?", "options": ["1's complement", "2's complement", "Sign-magnitude representation", "More than one of the above", "None of the above"], "answer": "d", "explanation": "1's complement, 2's complement, and sign-magnitude can represent negative\nnumbers.\n\n---"}, {"id": 25, "question": "Which complement system is easier to implement in hardware?", "options": ["1's complement", "2's complement", "Both equally easy", "More than one of the above", "None of the above Sure! Here are 5 more MCQs on the topic of 1's Complement:"], "answer": "b", "explanation": "2's complement simplifies arithmetic operations and removes negative zero.\n\n---"}, {"id": 26, "question": "What happens when you add a binary number and its 1's complement?", "options": ["Result is all 1s", "Result is all 0s", "Result is all 0s with a carry of 1", "More than one of the above", "None of the above"], "answer": "c", "explanation": "Sum is all 1s (which is -0), effectively zero plus carry.\n\n---"}, {"id": 27, "question": "Which of the following binary numbers is its own 1's complement?", "options": ["0000", "1111", "1010", "More than one of the above", "None of the above"], "answer": "e", "explanation": "No binary number equals its bitwise inverse except undefined cases.\n\n---"}, {"id": 28, "question": "In 1's complement representation, what is the binary representation of decimal zero?", "options": ["All bits 0", "All bits 1", "Both all 0s and all 1s", "More than one of the above", "None of the above"], "answer": "d", "explanation": "Both all 0s and all 1s represent +0 and -0 respectively.\n\n---"}, {"id": 29, "question": "What is a drawback of the 1's complement number system?", "options": ["It has two representations for zero", "It is complicated to invert bits", "It cannot represent negative numbers", "More than one of the above", "None of the above"], "answer": "a", "explanation": "This redundancy complicates arithmetic and comparisons.\n\n---"}, {"id": 30, "question": "To find the 1's complement of a binary fraction 101.101, what should be done?", "options": ["Invert all bits including fractional part", "Invert integer bits only", "Invert fractional bits only", "More than one of the above", "None of the above Use of 1's complement Absolutely! Here are **20 MCQs (31 to 50)** on the **Use of 1's Complement in Signed Binary Numbers** with options including “More than one of the above” and “None of the above”:"], "answer": "a", "explanation": "1's complement inverts every bit, integer and fractional.\n\nHere are the answers with explanations for MCQs 31 to 50 on the Use of 1's Complement\nin Signed Binary Numbers:\n\n---"}], "Use of 1's Complement": [{"id": 31, "question": "What is the main use of 1's complement in binary number systems?", "options": ["Represent unsigned numbers", "Represent signed binary numbers", "Represent decimal numbers", "More than one of the above", "None of the above"], "answer": "b", "explanation": "1's complement is mainly used to represent signed binary numbers, allowing representation of\nboth positive and negative numbers.\n\n---"}, {"id": 32, "question": "How is a positive number represented in signed binary using 1's complement?", "options": ["Same as its binary equivalent with MSB 0", "By finding the 1's complement of its binary", "By adding 1 to the binary number", "More than one of the above", "None of the above"], "answer": "a", "explanation": "Positive numbers in 1's complement are represented just like their binary equivalent, with the\nMost Significant Bit (MSB) set to 0 indicating positive.\n\n---"}, {"id": 33, "question": "In 1's complement representation, how is a negative number represented?", "options": ["Invert all bits of the positive number", "Add 1 to the positive number", "Use sign magnitude only", "More than one of the above", "None of the above"], "answer": "a", "explanation": "Negative numbers are represented by taking the 1's complement of the corresponding positive\nnumber, i.e., inverting each bit.\n\n---"}, {"id": 34, "question": "What does the MSB (Most Significant Bit) indicate in 1's complement signed binary", "options": ["Value of the number", "Whether the number is positive or negative", "The least value bit", "More than one of the above", "None of the above"], "answer": "b", "explanation": "In signed 1's complement, the MSB acts as the sign bit: 0 indicates positive, and 1 indicates\nnegative.\n\n---"}, {"id": 35, "question": "Using 5-bit registers, how is +6 represented?", "options": ["00110", "0110", "0 0110", "More than one of the above", "None of the above"], "answer": "c", "explanation": "+6 in a 5-bit register is represented as `0` (sign bit for positive) followed by binary `0110`.\n\n---"}, {"id": 36, "question": "What is the 1's complement of +6 represented as 0 0110 in 5-bit 1's complement?", "options": ["0 0110", "1 1001", "0 1001", "More than one of the above", "None of the above"], "answer": "b", "explanation": "1's complement of `0 0110` is `1 1001` (invert all bits), indicating -6.\n\n---"}, {"id": 37, "question": "In the 5-bit 1's complement system, what does the number 1 1001 represent?", "options": ["+6", "-6", "+9", "More than one of the above", "None of the above"], "answer": "b", "explanation": "In 1's complement with 5 bits, `1 1001` is the negative representation of +6, i.e., -6.\n\n---"}, {"id": 38, "question": "What is the size of the register used to represent +120 and -120 in the given example?", "options": ["4-bit", "5-bit", "8-bit", "More than one of the above", "None of the above"], "answer": "c", "explanation": "The example uses an 8-bit register to represent +120 and -120.\n\n---"}, {"id": 39, "question": "How is +120 represented in the 8-bit signed 1's complement system?", "options": ["01111000", "0 1111000", "1111000", "More than one of the above", "None of the above"], "answer": "b", "explanation": "+120 is represented as `0` sign bit followed by binary `1111000` in 8-bit register.\n\n---"}, {"id": 40, "question": "What is the 1's complement of +120 (0 1111000) in 8-bit register?", "options": ["1 0000111", "0 0000111", "1 1111000", "More than one of the above", "None of the above"], "answer": "a", "explanation": "1's complement of `0 1111000` is `1 0000111` (invert all bits), representing -120.\n\n---"}, {"id": 41, "question": "In 1's complement notation, which bit indicates the sign of the number?", "options": ["Least Significant Bit (LSB)", "Most Significant Bit (MSB)", "Middle bit", "More than one of the above", "None of the above"], "answer": "b", "explanation": "MSB in 1's complement signed numbers indicates the sign (0 = positive, 1 = negative).\n\n---"}, {"id": 42, "question": "If the 1's complement of a positive number is taken, the result will represent:", "options": ["A positive number", "Its negative equivalent", "Zero", "More than one of the above", "None of the above"], "answer": "b", "explanation": "Taking the 1's complement of a positive number gives the negative equivalent in signed binary.\n\n---"}, {"id": 43, "question": "What is the range of numbers that can be represented using an n-bit 1's complement", "options": ["From 0 to 2^n -1", "From -(2^(n-1)-1) to +(2^(n-1)-1)", "From -(2^(n-1)-1) to +(2^(n-1)-1), with two zeros", "More than one of the above", "None of the above"], "answer": "c", "explanation": "1's complement represents numbers in the range ±(2^(n-1) -1) but has two representations of\nzero (all 0s and all 1s).\n\n---"}, {"id": 44, "question": "Which of the following is true about zero representation in 1's complement?", "options": ["Only one zero representation exists", "Zero can be represented as all 0s and all 1s", "Zero cannot be represented", "More than one of the above", "None of the above"], "answer": "b", "explanation": "In 1's complement, zero has two forms: positive zero (all 0s) and negative zero (all 1s).\n\n---"}, {"id": 45, "question": "Which of the following arithmetic operations can be performed easily using 1's", "options": ["Addition", "Subtraction", "Multiplication", "More than one of the above", "None of the above"], "answer": "d", "explanation": "1's complement allows addition and subtraction, but multiplication is more complex.\n\n---"}, {"id": 46, "question": "If the MSB of a binary number in 1's complement is 1, what does that indicate?", "options": ["The number is positive", "The number is negative", "The number is zero", "More than one of the above", "None of the above"], "answer": "b", "explanation": "If MSB = 1 in 1's complement, it means the number is negative.\n\n---"}, {"id": 47, "question": "Which of the following steps correctly represents converting +6 to -6 in 5-bit 1's", "options": ["Write binary of 6 00110, invert bits 11001", "Write binary of 6 00110, add 1 00111", "Write binary of 6 00110, invert bits 00101", "More than one of the above", "None of the above"], "answer": "a", "explanation": "To convert +6 to -6, write binary of 6 and invert all bits for 1's complement.\n\n---"}, {"id": 48, "question": "What is the 1's complement of the binary number 0 1111000 (representing +120) in an", "options": ["1 0000111", "0 0000111", "1 1111000", "More than one of the above", "None of the above"], "answer": "a", "explanation": "1's complement of `0 1111000` (120) is `1 0000111` (-120).\n\n---"}, {"id": 49, "question": "Why is the 1's complement technique used to represent negative numbers?", "options": ["Because it is easy to convert positive to negative", "Because it simplifies addition and subtraction", "Because it removes ambiguity in zero", "More than one of the above", "None of the above"], "answer": "d", "explanation": "1's complement is used because it allows easy conversion from positive to negative and helps in\narithmetic operations like addition and subtraction.\n\n---"}, {"id": 50, "question": "Which of the following statements is true about 1's complement in signed binary", "options": ["Negative numbers are obtained by inverting positive number bits", "MSB denotes the sign of the number", "1's complement arithmetic requires handling of end-around carry", "More than one of the above", "None of the above"], "answer": "d", "explanation": "All statements are true: negative numbers are represented by inverting bits, MSB is the sign bit,\nand 1's complement arithmetic involves handling end-around carry."}]};
let currentTopic="",qs=[],idx=0,ans={},reviewMode=false;
function show(id){["home","quiz","result"].forEach(x=>document.getElementById(x).classList.add("hidden"));document.getElementById(id).classList.remove("hidden");}
function renderTopics(){
 const box=document.getElementById("topicList");box.innerHTML="";
 Object.keys(topics).forEach((t,i)=>{const b=document.createElement("button");b.className="topic";b.textContent=`Topic-${i+1}: ${t} (${topics[t].length} Questions)`;b.onclick=()=>startTopic(t);box.appendChild(b);});
}
function startTopic(t){currentTopic=t;qs=topics[t];idx=0;ans={};reviewMode=false;document.getElementById("topicTitle").textContent=t;show("quiz");render();}
function render(){
 const q=qs[idx];document.getElementById("progress").textContent=`Question ${idx+1} of ${qs.length}`;document.getElementById("question").textContent=q.question;
 const box=document.getElementById("options");box.innerHTML="";
 q.options.forEach((o,i)=>{const l="abcde"[i],b=document.createElement("button");b.className="option"+(ans[q.id]===l?" selected":"");b.textContent=l.toUpperCase()+") "+o;
 if(reviewMode){b.disabled=true;if(l===q.answer)b.classList.add("correct");if(ans[q.id]===l&&l!==q.answer)b.classList.add("wrong");}
 else b.onclick=()=>{ans[q.id]=l;render();};box.appendChild(b);});
 const ex=document.getElementById("explanation");
 if(reviewMode){ex.classList.remove("hidden");const ai="abcde".indexOf(q.answer);ex.innerHTML="<b>Correct Answer: "+q.answer.toUpperCase()+") "+q.options[ai]+"</b><br><br><b>Explanation:</b><br>"+(q.explanation||"").replace(/\n/g,"<br>");}
 else ex.classList.add("hidden");
 const p=document.getElementById("palette");p.innerHTML="<b>Question Palette</b><br>";
 qs.forEach((x,i)=>{const b=document.createElement("button");b.textContent=i+1;if(ans[x.id])b.classList.add("done");b.onclick=()=>{idx=i;render();};p.appendChild(b);});
}
function prev(){if(idx>0){idx--;render();}} function next(){if(idx<qs.length-1){idx++;render();}}
function finish(){if(!confirm("Submit your test?"))return;const correct=qs.filter(q=>ans[q.id]===q.answer).length,attempted=Object.keys(ans).length;document.getElementById("score").textContent=`Score: ${correct} / ${qs.length}`;document.getElementById("stats").textContent=`Attempted: ${attempted} | Correct: ${correct} | Wrong: ${attempted-correct} | Unattempted: ${qs.length-attempted}`;show("result");}
function review(){reviewMode=true;idx=0;document.getElementById("topicTitle").textContent=currentTopic+" - Review";show("quiz");render();}
function restart(){idx=0;ans={};reviewMode=false;document.getElementById("topicTitle").textContent=currentTopic;show("quiz");render();}
function goHome(){show("home");renderTopics();}
renderTopics();
</script>
