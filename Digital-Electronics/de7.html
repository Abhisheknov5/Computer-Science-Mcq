
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASCII MCQ Practice</title><style>body{font-family:Arial;background:#f3f4f6;margin:0;padding:20px}.box{max-width:800px;margin:auto;background:#fff;padding:20px;border-radius:12px}.topic,button{padding:12px;margin:6px;border-radius:8px;border:1px solid #ddd;cursor:pointer}.topic{display:block;width:100%;text-align:left;font-size:16px}.hidden{display:none}.option{display:block;width:100%;text-align:left;margin:8px 0;padding:12px}.selected{border:2px solid #2563eb}.correct{background:#dcfce7}.wrong{background:#fee2e2}.primary{background:#2563eb;color:white}.palette button{min-width:40px}.done{background:#bbf7d0}</style></head><body><div class="box"><div id="home"><h1>📚 ASCII MCQ Practice</h1><div id="topics"></div></div><div id="quiz" class="hidden"><button onclick="goHome()">← Topics</button><h2 id="title"></h2><b id="progress"></b><h3 id="q"></h3><div id="opts"></div><div id="exp" class="hidden"></div><button onclick="prev()">Previous</button><button onclick="next()">Next</button><button class="primary" onclick="finish()">Submit Test</button><div class="palette" id="pal"></div></div><div id="result" class="hidden"><h1>🎯 Result</h1><h2 id="score"></h2><p id="stats"></p><button onclick="review()">Review Answers</button><button onclick="restart()">Try Again</button><button onclick="goHome()">Topics</button></div></div><script>
