
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gray Code MCQ Practice</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  margin:0;
  color:#1f2937;
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card{
  background:#fff;
  padding:24px;
  border-radius:14px;
  box-shadow:0 2px 10px #0001;
  margin-bottom:16px;
}

.option{
  display:block;
  width:100%;
  text-align:left;
  padding:14px;
  margin:10px 0;
  background:white;
  border:1px solid #d1d5db;
  border-radius:9px;
  font-size:16px;
  cursor:pointer;
}

.selected{
  border:2px solid #2563eb;
  background:#eff6ff;
}

button,select{
  padding:11px 16px;
  border:0;
  border-radius:8px;
  cursor:pointer;
  font-size:16px;
  margin:4px;
}

.primary{
  background:#2563eb;
  color:white;
}

.secondary{
  background:#e5e7eb;
}

.hidden{
  display:none;
}

.top{
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
}

.correct{
  background:#dcfce7;
  border:2px solid #16a34a;
}

.wrong{
  background:#fee2e2;
  border:2px solid #dc2626;
}

.explain{
  margin-top:14px;
  padding:14px;
  background:#f8fafc;
  border-radius:8px;
  line-height:1.6;
}

#palette button{
  min-width:42px;
}

.done{
  background:#bbf7d0;
}

.current{
  outline:2px solid #2563eb;
}

.topic{
  display:block;
  width:100%;
  text-align:left;
  padding:16px;
  margin:10px 0;
  border:1px solid #d1d5db;
  border-radius:10px;
  background:white;
  cursor:pointer;
  font-size:17px;
}

.small{
  color:#6b7280;
}
</style>
</head>

<body>

<div class="wrap">

<!-- HOME -->
<div id="home" class="card">

<h1>🔢 Gray Code MCQ Practice</h1>

<p class="small">
25 Questions | Topic-wise Practice
</p>

<div id="topics"></div>

</div>


<!-- SETUP -->
<div id="setup" class="card hidden">

<button class="secondary" onclick="goHome()">
← Back
</button>

<h2 id="topicTitle"></h2>

<p id="topicInfo"></p>

<label>
Practice Questions:
<select id="count"></select>
</label>

<br><br>

<button class="primary" onclick="startQuiz()">
Start Practice
</button>

</div>


<!-- QUIZ -->
<div id="quiz" class="hidden">

<div class="card top">

<b id="progress"></b>

<b id="topicBadge"></b>

</div>


<div class="card">

<h2 id="question"></h2>

<div id="options"></div>

<div id="explanation" class="hidden explain"></div>

</div>


<div class="card top">

<div>

<button class="secondary" onclick="prevQuestion()">
Previous
</button>

<button class="primary" onclick="nextQuestion()">
Next
</button>

</div>

<button class="primary" onclick="finishQuiz()">
Submit Test
</button>

</div>


<div id="palette" class="card"></div>

</div>


<!-- RESULT -->
<div id="result" class="card hidden">

<h1>🎯 Result</h1>

<h2 id="score"></h2>

<p id="stats"></p>

<button class="primary" onclick="reviewAnswers()">
Review Answers & Explanations
</button>

<button class="secondary" onclick="restartQuiz()">
Try Again
</button>

<button class="secondary" onclick="goHome()">
Choose Topic
</button>

</div>

</div>

},

},

{

{

{
id:23,
question:"What is the decimal equivalent of the Gray Code 1010?",
options:[

],
answer:"c",
explanation:"According to the provided answer set, the answer is option C."
},

{
id:24,
question:"The Gray Code for decimal number 7 is:",
options:[
"1000",
"1100",
"0111",
"More than one of the above",

],
answer:"c",
explanation:"According to the provided answer set, the Gray Code for decimal 7 is 0111."
},

{
id:25,
question:"In the Gray Code table, which binary number corresponds to the decimal number 11?",
options:[
"1100",
"1111",

],
answer:"b",
explanation:"According to the provided answer set, the answer is option B."
}

]
}

];


let selectedTopic = null;
let qs = [];
let idx = 0;
let ans = {};
let reviewMode = false;


function show(id){

["home","setup","quiz","result"].forEach(x=>{

document.getElementById(x).classList.add("hidden");

});

document.getElementById(id).classList.remove("hidden");

}


function renderTopics(){

let box=document.getElementById("topics");

box.innerHTML="";

topics.forEach((topic,i)=>{

let button=document.createElement("button");

button.className="topic";

button.innerHTML=
"<b>"+topic.name+"</b><br>"+
"<span class='small'>"+
topic.questions.length+
" Questions</span>";

button.onclick=()=>chooseTopic(i);

box.appendChild(button);

});

}


function chooseTopic(i){

selectedTopic=topics[i];

document.getElementById("topicTitle").textContent=
selectedTopic.name;

document.getElementById("topicInfo").textContent=
selectedTopic.questions.length+
" questions available";


let select=document.getElementById("count");

select.innerHTML="";


[5,10]
.filter(n=>n<=selectedTopic.questions.length)
.forEach(n=>{

let option=document.createElement("option");

option.value=n;

option.textContent=n;

select.appendChild(option);

});


let all=document.createElement("option");

all.value=selectedTopic.questions.length;

all.textContent=
"All ("+
selectedTopic.questions.length+
")";

select.appendChild(all);

select.value=selectedTopic.questions.length;


show("setup");

}


function shuffle(array){

return [...array].sort(
()=>Math.random()-0.5
);

}


function startQuiz(){

let count=
Number(document.getElementById("count").value);

qs=
shuffle(selectedTopic.questions)
.slice(0,count);

idx=0;

ans={};

reviewMode=false;

show("quiz");

renderQuestion();

}


function renderQuestion(){

let q=qs[idx];


document.getElementById("progress").textContent=
"Question "+
(idx+1)+
" of "+
qs.length;


document.getElementById("topicBadge").textContent=
selectedTopic.name;


document.getElementById("question").textContent=
q.question;


let box=
document.getElementById("options");

box.innerHTML="";


q.options.forEach((option,i)=>{

let letters="abcde";

let letter=letters[i];

let button=document.createElement("button");


button.className=
"option"+
(ans[q.id]===letter
? " selected"
: "");


button.textContent=
letter.toUpperCase()+
") "+
option;


if(reviewMode){

button.disabled=true;


if(letter===q.answer){

button.classList.add("correct");

}


if(
ans[q.id]===letter &&
letter!==q.answer
){

button.classList.add("wrong");

}

}else{

button.onclick=()=>{

ans[q.id]=letter;

renderQuestion();

};

}


box.appendChild(button);

});


let explanation=
document.getElementById("explanation");


if(reviewMode){

explanation.classList.remove("hidden");


explanation.innerHTML=
"<b>Correct Answer: "+
q.answer.toUpperCase()+
") "+
q.options[
"abcde".indexOf(q.answer)
]+
"</b><br><br>"+
"<b>Explanation:</b> "+
q.explanation;

}else{

explanation.classList.add("hidden");

}


renderPalette();

}


function renderPalette(){

let palette=
document.getElementById("palette");

palette.innerHTML=
"<b>Question Palette</b><br>";


qs.forEach((question,i)=>{

let button=document.createElement("button");

button.textContent=i+1;


if(ans[question.id]){

button.classList.add("done");

}


if(i===idx){

button.classList.add("current");

}


button.onclick=()=>{

idx=i;

renderQuestion();

};


palette.appendChild(button);

});

}


function prevQuestion(){

if(idx>0){

idx--;

renderQuestion();

}

}


function nextQuestion(){

if(idx<qs.length-1){

idx++;

renderQuestion();

}

}


function finishQuiz(){

if(!confirm("Submit your test?")){

return;

}


let correct=
qs.filter(
q=>ans[q.id]===q.answer
).length;


let attempted=
Object.keys(ans).length;


document.getElementById("score").textContent=
"Score: "+
correct+
" / "+
qs.length;


document.getElementById("stats").textContent=
"Attempted: "+
attempted+
" | Correct: "+
correct+
" | Wrong: "+
(attempted-correct)+
" | Unattempted: "+
(qs.length-attempted);


show("result");

}


function reviewAnswers(){

reviewMode=true;

idx=0;

show("quiz");

renderQuestion();

}


function restartQuiz(){

startQuiz();

}


function goHome(){

show("home");

}


renderTopics();

</script>

</body>
</html>
