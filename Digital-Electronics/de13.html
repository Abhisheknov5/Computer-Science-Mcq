
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Addition and Subtraction using 1's Complement</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#1f2937}.container{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border-radius:14px;padding:24px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,.08)}.hidden{display:none}button{padding:11px 16px;border:0;border-radius:8px;cursor:pointer;font-size:15px;background:#e5e7eb}.topic-btn,.option{width:100%;text-align:left;padding:15px;margin:10px 0;border:1px solid #d1d5db;border-radius:10px;background:#fff;font-size:16px;cursor:pointer}.topic-btn{font-weight:bold}.selected{border:2px solid #2563eb;background:#eff6ff}.correct{background:#dcfce7;border-color:#16a34a}.wrong{background:#fee2e2;border-color:#dc2626}.primary{background:#2563eb;color:#fff}.controls,.topbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}#palette button{min-width:42px;margin:4px}.done{background:#bbf7d0}.explanation{margin-top:16px;padding:14px;background:#f8fafc;border-radius:9px;line-height:1.6}.small{color:#6b7280}</style></head><body><div class="container">

<div id="quiz" class="hidden"><div class="card topbar"><b id="progress"></b><b id="topicTitle"></b></div><div class="card"><h2 id="question"></h2><div id="options"></div><div id="explanation" class="hidden explanation"></div></div><div class="card controls"><div><button onclick="prev()">Previous</button><button class="primary" onclick="next()">Next</button></div><div><button onclick="goHome()">Topics</button><button class="primary" onclick="submitTest()">Submit Test</button></div></div><div class="card"><b>Question Palette</b><div id="palette"></div></div></div>

<script>
const topics=[{"name": "Topic 1: Addition using 1's Complement", "questions": [{"num": 1, "question": "What is the first step in adding a positive and a negative number using 1's complement?", "options": ["Add the two numbers directly", "Find the 1's complement of the negative number", "Find the 2's complement of the negative number", "More than one of the above", "None of the above"], "answer": "b", "explanation": "In 1's complement addition involving a negative number, we first find the 1's complement of the negative number before adding."}, {"num": 2, "question": "When adding a positive number and a negative number in 1's complement, what happens if there is an end-around carry?", "options": ["It is discarded", "It is added to the most significant bit (MSB)", "It is added to the least significant bit (LSB)", "More than one of the above", "None of the above"], "answer": "c", "explanation": "The end-around carry is added back to the LSB to complete the 1's complement addition."}, {"num": 3, "question": "How is the 1's complement of a binary number calculated?", "options": ["Add 1 to the binary number", "Change all 0s to 1s and all 1s to 0s", "Change all 1s to 0s only", "More than one of the above", "None of the above"], "answer": "b", "explanation": "1's complement is obtained by flipping every bit."}, {"num": 4, "question": "In Case 1 of 1's complement addition, when the positive number has a greater magnitude, what is done after adding the two numbers?", "options": ["Nothing, the result is final", "The carry-out is added to the LSB", "The 1's complement of the sum is taken", "More than one of the above", "None of the above"], "answer": "b", "explanation": "The carry-out from the MSB is wrapped around and added to the LSB in 1's complement addition."}, {"num": 5, "question": "What is the result type when adding a positive number to a negative number where the negative number has a higher magnitude (Case 2)?", "options": ["Positive number", "Negative number", "Zero", "More than one of the above", "None of the above"], "answer": "b", "explanation": "When the negative number has a higher magnitude, the result is negative."}, {"num": 6, "question": "In Case 2, if no end-around carry is generated after addition, what is the next step?", "options": ["Discard the result", "Take the 1's complement of the result", "Add 1 to the result", "More than one of the above", "None of the above"], "answer": "b", "explanation": "If no end-around carry occurs, the final result is the 1's complement of the sum."}, {"num": 7, "question": "When adding two negative numbers using 1's complement, what is always true about the carry?", "options": ["No carry occurs", "End-around carry always occurs", "The carry is ignored", "More than one of the above", "None of the above"], "answer": "b", "explanation": "Adding two negative numbers in 1's complement always produces an end-around carry."}, {"num": 8, "question": "After adding two negative numbers and getting the end-around carry, what do we do next?", "options": ["Ignore the carry", "Add the carry to the LSB", "Subtract the carry from the sum", "More than one of the above", "None of the above"], "answer": "b", "explanation": "The end-around carry is added to the LSB to finalize the sum."}, {"num": 9, "question": "How do you find the final result after adding two negative numbers using 1's complement?", "options": ["Take the 1's complement of the sum after adding carry", "Take the 2's complement of the sum", "Use the sum as it is", "More than one of the above", "None of the above"], "answer": "a", "explanation": "The final step is to take the 1's complement of the sum after including the carry."}, {"num": 10, "question": "What is the 1's complement of the binary number 1001?", "options": ["0110", "1001", "1111", "More than one of the above", "None of the above"], "answer": "a", "explanation": "Flip each bit of 1001 to get 0110."}, {"num": 11, "question": "What is the sum of 1101 and 0110 in binary, including carry?", "options": ["11011", "10011 with carry 1", "10101 with carry 0", "More than one of the above", "None of the above"], "answer": "b", "explanation": "1101 + 0110 = 10011 in binary (with a carry of 1)."}, {"num": 12, "question": "In 1's complement addition, what does the term \"end-around carry\" mean?", "options": ["Carry generated in the middle of the addition", "Carry generated from MSB that is added back to LSB", "Carry discarded after addition", "More than one of the above", "None of the above"], "answer": "b", "explanation": "The end-around carry is the carry out from MSB, which is added to LSB."}, {"num": 13, "question": "What is the result of adding 1101 and 0001 in 1's complement?", "options": ["1110", "0001", "1111", "More than one of the above", "None of the above"], "answer": "a", "explanation": "1101 + 0001 = 1110 in binary."}, {"num": 14, "question": "After adding 1101 and 0001 and getting 1110, what is the final step if no carry occurs?", "options": ["Take the 1's complement of 1110", "Add 1 to 1110", "Use 1110 as final result", "More than one of the above", "None of the above"], "answer": "a", "explanation": "Without carry, we complement the result to get the negative number."}, {"num": 15, "question": "In a 5-bit register, what is the 1's complement of 01110?", "options": ["10001", "01110", "11110", "More than one of the above", "None of the above"], "answer": "a", "explanation": "Flip each bit of 01110 to get 10001."}, {"num": 16, "question": "If the sum of two 1's complement numbers is 1 00011 (with carry), what is the next step?", "options": ["Discard the carry and keep 00011", "Add carry 1 to 00011", "Subtract carry from 00011", "More than one of the above", "None of the above"], "answer": "b", "explanation": "End-around carry 1 is added back to the LSB part (00011)."}, {"num": 17, "question": "What is the 1's complement of the binary number 00100?", "options": ["11011", "11100", "00011", "More than one of the above", "None of the above"], "answer": "a", "explanation": "Flip each bit of 00100 to get 11011."}, {"num": 18, "question": "Which case of addition in 1's complement always results in a negative number?", "options": ["Case 1", "Case 2", "Case 3", "More than one of the above", "None of the above"], "answer": "d", "explanation": "Both adding a positive to a bigger negative and adding two negatives result in negative values."}, {"num": 19, "question": "Which of the following is true about 1's complement addition?", "options": ["It requires end-around carry adjustment", "Negative numbers are represented by bit inversion", "Final result might require complement operation", "More than one of the above", "None of the above"], "answer": "d", "explanation": "All the first three options are true in 1's complement addition."}, {"num": 20, "question": "When adding 1101 and -1110 in 1's complement, what is the first step?", "options": ["Add directly", "Find 1's complement of 1110", "Find 2's complement of 1110", "More than one of the above", "None of the above"], "answer": "b", "explanation": "The negative number 1110’s 1's complement must be found before addition."}, {"num": 21, "question": "If you add 1101 and the 1's complement of 1110, and get 1110, what is the next step?", "options": ["Add end-around carry", "Take 1's complement of 1110", "Use 1110 as result", "More than one of the above", "None of the above"], "answer": "b", "explanation": "Without carry, take the 1's complement of the sum for the negative result."}, {"num": 22, "question": "How is a negative number represented in 1's complement?", "options": ["By adding 1 to the binary number", "By inverting all bits of the positive number", "By keeping the same number with a minus sign", "More than one of the above", "None of the above"], "answer": "b", "explanation": "Negative numbers are represented by bit inversion (1's complement) of positive numbers."}, {"num": 23, "question": "In 1's complement addition, what is done if the sum results in a number with an end-around carry?", "options": ["Carry is ignored", "Carry is added to the least significant bit", "Carry is subtracted", "More than one of the above", "None of the above"], "answer": "b", "explanation": "End-around carry must be added to the LSB in 1's complement addition."}, {"num": 24, "question": "Which of the following numbers is the 1's complement of 01101 in a 5-bit system?", "options": ["10010", "01110", "10101", "More than one of the above", "None of the above"], "answer": "a", "explanation": "Flip each bit of 01101 to get 10010."}, {"num": 25, "question": "What should be done after adding two negative numbers in 1's complement, including carry?", "options": ["Take 2's complement of the sum", "Take 1's complement of the sum after adding carry", "Use sum as it is", "More than one of the above", "None of the above Topic-2 Subtraction using 1's complement"], "answer": "b", "explanation": "After adding two negative numbers and carry, take the 1's complement of the result to finalize. Sure! Here are the **answers with explanations** for the MCQs (26 to 50) on subtraction using 1's complement: ---"}]}, {"name": "Topic 2: Subtraction using 1's Complement", "questions": [{"num": 26, "question": "What is the binary result of 10101 + 11000 before adding carry?", "options": ["01101", "1 01101", "11101", "More than one of the above", "None of the above"], "answer": "b", "explanation": "* Adding 10101 and 11000 gives 1 01101 (a 6-bit result including carry)."}, {"num": 27, "question": "When adding 10101 and the 1's complement of 00111, what is the carry bit?", "options": ["0", "1", "2", "More than one of the above", "None of the above"], "answer": "b", "explanation": "* There is an end-around carry bit 1 generated in the addition."}, {"num": 28, "question": "After adding the carry to the LSB of 01101, what is the final binary result?", "options": ["01101", "01110", "10101", "More than one of the above", "None of the above"], "answer": "b", "explanation": "* Add the carry (1) to the LSB of 01101 01101 + 1 = 01110."}, {"num": 29, "question": "What is the first step in subtraction using 1's complement?", "options": ["Find 2's complement of subtrahend", "Find 1's complement of subtrahend", "Add minuend and subtrahend", "More than one of the above", "None of the above"], "answer": "b", "explanation": "* Subtraction by 1's complement starts by complementing the subtrahend."}, {"num": 30, "question": "In subtraction using 1's complement, what happens if no carry bit is generated?", "options": ["Result is positive", "Take 1's complement of the result", "Add 1 to the result", "More than one of the above", "None of the above"], "answer": "b", "explanation": "* If no carry is generated, the result is negative; so complement the result."}, {"num": 31, "question": "What is the 1's complement of binary 10111?", "options": ["01000", "10111", "11000", "More than one of the above", "None of the above"], "answer": "a", "explanation": "* 1's complement flips every bit: 10111 01000."}, {"num": 32, "question": "What is the sum of 10101 and 01000?", "options": ["11101", "10101", "01110", "More than one of the above", "None of the above"], "answer": "a", "explanation": "* Adding 10101 and 01000 results in 11101."}, {"num": 33, "question": "If no carry bit occurs, how do you interpret the result?", "options": ["Positive number", "Negative number", "Zero", "More than one of the above", "None of the above"], "answer": "b", "explanation": "* No carry bit means the result is negative in 1's complement subtraction."}, {"num": 34, "question": "The 1's complement of 11101 is:", "options": ["00010", "11110", "00101", "More than one of the above", "None of the above"], "answer": "a", "explanation": "* Flip each bit of 11101 00010."}, {"num": 35, "question": "Which of the following is true about subtraction using 1's complement?", "options": ["Carry bit indicates positive result", "No carry bit indicates negative result", "Carry bit always appears", "More than one of the above", "None of the above"], "answer": "d", "explanation": "* Both a) and b) are true: carry indicates positive result; no carry indicates negative."}, {"num": 36, "question": "In subtraction using 1's complement, what is the significance of the carry bit?", "options": ["It must be discarded", "It is added to the LSB", "It indicates overflow", "More than one of the above", "None of the above"], "answer": "b", "explanation": "* Carry is added back to the LSB (end-around carry)."}, {"num": 37, "question": "What is the main advantage of using 1's complement for subtraction?", "options": ["Only addition operations are needed", "Subtraction is simplified", "Negative numbers can be represented", "More than one of the above", "None of the above"], "answer": "d", "explanation": "* Addition replaces subtraction, simplifying the operation and representing negatives."}, {"num": 38, "question": "If you subtract 10111 from 10101 using 1's complement and get no carry, what does the result signify?", "options": ["The result is positive", "The result is negative", "The result is zero", "More than one of the above", "None of the above"], "answer": "b", "explanation": "* No carry means negative result after complementing the sum."}, {"num": 39, "question": "When adding the 1's complement of the subtrahend to the minuend, what operation replaces subtraction?", "options": ["Multiplication", "Division", "Addition", "More than one of the above", "None of the above"], "answer": "c", "explanation": "* Subtraction is performed by adding the 1's complement of the subtrahend."}, {"num": 40, "question": "The final step when the carry is generated in 1's complement subtraction is:", "options": ["Take 2's complement of the result", "Add the carry to the LSB", "Ignore the carry", "More than one of the above", "None of the above"], "answer": "b", "explanation": "* If carry occurs, add it to the LSB to get the correct result."}, {"num": 41, "question": "How do you handle the carry generated from addition in 1's complement subtraction?", "options": ["Add it to MSB", "Add it to LSB", "Subtract it from the sum", "More than one of the above", "None of the above"], "answer": "b", "explanation": "* The end-around carry is added to the least significant bit."}, {"num": 42, "question": "If the minuend is 5 bits, what is the size of the 1's complement of the subtrahend?", "options": ["4 bits", "5 bits", "6 bits", "More than one of the above", "None of the above"], "answer": "b", "explanation": "* The complement is taken on the same number of bits as the original number."}, {"num": 43, "question": "Which of the following binary numbers has a 1's complement of 01000?", "options": ["10111", "10101", "00111", "More than one of the above", "None of the above"], "answer": "a", "explanation": "* 1's complement of 10111 is 01000."}, {"num": 44, "question": "What is the final result of 10101 - 00111 using 1's complement?", "options": ["01110", "01101", "10101", "More than one of the above", "None of the above"], "answer": "a", "explanation": "* From example 1, 10101 - 00111 results in 01110."}, {"num": 45, "question": "In subtraction using 1's complement, what does the absence of carry indicate?", "options": ["Result is zero", "Result is positive", "Result is negative", "More than one of the above", "None of the above"], "answer": "c", "explanation": "* No carry means the final result is negative after complementing."}, {"num": 46, "question": "Which of the following correctly describes 1's complement subtraction?", "options": ["Subtract by adding 1's complement of subtrahend", "Add the carry if generated", "If no carry, complement the result", "More than one of the above", "None of the above"], "answer": "d", "explanation": "* All a), b), and c) correctly describe the process."}, {"num": 47, "question": "What does the 1's complement of the subtrahend represent?", "options": ["Negative of subtrahend", "Positive of subtrahend", "Inverse bits of subtrahend", "More than one of the above", "None of the above"], "answer": "c", "explanation": "* 1's complement flips the bits, which is the inverse of the subtrahend."}, {"num": 48, "question": "Which operation is NOT part of 1's complement subtraction?", "options": ["Finding 1's complement of subtrahend", "Adding complement to minuend", "Adding carry to LSB if exists", "Multiplying minuend by subtrahend", "None of the above"], "answer": "d", "explanation": "* Multiplication is not part of subtraction by 1's complement."}, {"num": 49, "question": "What is the 1's complement of 00000?", "options": ["11111", "00000", "11110", "More than one of the above", "None of the above"], "answer": "a", "explanation": "* Complement of all zeros is all ones."}, {"num": 50, "question": "What happens if you add 1's complement of a number to itself?", "options": ["Result is all ones", "Result is zero with carry", "Result equals the original number", "More than one of the above", "None of the above"], "answer": "a", "explanation": "* Adding 1's complement of a number to itself results in all bits set to 1."}]}];let qs=[],index=0,answers={},reviewMode=false;
function show(id){['home','quiz','result'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}
function renderTopics(){let b=document.getElementById('topicList');b.innerHTML='';topics.forEach((t,i)=>{let x=document.createElement('button');x.className='topic-btn';x.textContent=`${t.name} (${t.questions.length} Questions)`;x.onclick=()=>start(i);b.appendChild(x)})}
function start(i){qs=topics[i].questions;index=0;answers={};reviewMode=false;document.getElementById('topicTitle').textContent=topics[i].name;show('quiz');render()}
function render(){let q=qs[index];document.getElementById('progress').textContent=`Question ${index+1} of ${qs.length}`;document.getElementById('question').textContent=q.question;let b=document.getElementById('options');b.innerHTML='';q.options.forEach((o,i)=>{let l='abcde'[i],x=document.createElement('button');x.className='option';if(answers[index]===l)x.classList.add('selected');x.textContent=l.toUpperCase()+') '+o;if(reviewMode){x.disabled=true;if(l===q.answer)x.classList.add('correct');if(answers[index]===l&&l!==q.answer)x.classList.add('wrong')}else x.onclick=()=>{answers[index]=l;render()};b.appendChild(x)});let e=document.getElementById('explanation');if(reviewMode){e.classList.remove('hidden');let ai='abcde'.indexOf(q.answer);e.innerHTML='<b>Correct Answer: '+q.answer.toUpperCase()+') '+q.options[ai]+'</b><br><br><b>Explanation:</b><br>'+(q.explanation||'Explanation not available in source.')}else e.classList.add('hidden');let p=document.getElementById('palette');p.innerHTML='';qs.forEach((_,i)=>{let x=document.createElement('button');x.textContent=i+1;if(answers[i])x.classList.add('done');x.onclick=()=>{index=i;render()};p.appendChild(x)})}
function prev(){if(index>0){index--;render()}}function next(){if(index<qs.length-1){index++;render()}}function submitTest(){let c=qs.filter((q,i)=>answers[i]===q.answer).length,a=Object.keys(answers).length;document.getElementById('score').textContent=`Score: ${c} / ${qs.length}`;document.getElementById('stats').textContent=`Attempted: ${a} | Correct: ${c} | Wrong: ${a-c} | Unattempted: ${qs.length-a}`;show('result')}function review(){reviewMode=true;index=0;show('quiz');render()}function restart(){answers={};index=0;reviewMode=false;show('quiz');render()}function goHome(){show('home')}renderTopics();
</script></body></html>
