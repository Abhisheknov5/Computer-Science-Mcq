<script>const topics=[{"name": "Topic 1: MCQ on Radix and Diminished Radix Complement", "questions": [{"question": "What is the Radix complement also known as?", "options": ["(r-1)’s complement", "Diminished radix complement", "r’s complement", "More than one of the above", "None of the above"], "answer": "c", "explanation": "Radix complement refers to the r's complement of a number in base r."}, {"question": "What is the Diminished Radix complement also known as?", "options": ["r’s complement", "r-1’s complement", "1’s complement only", "More than one of the above", "None of the above"], "answer": "b", "explanation": "The diminished radix complement is the (r-1)'s complement."}, {"question": "What is the base (radix) of a decimal number system?", "options": ["2", "8", "10", "More than one of the above", "None of the above"], "answer": "c", "explanation": "The decimal system uses base 10."}, {"question": "What is the 9's complement of 321?", "options": ["678", "679", "6789", "More than one of the above", "None of the above"], "answer": "a", "explanation": "9’s complement of 321 = 999 – 321 = 678."}, {"question": "Which formula is used to find the r’s complement?", "options": ["r^n - N", "(r^n - 1) - N", "N - r^n", "More than one of the above", "None of the above"], "answer": "a", "explanation": "The r’s complement of a number N with n digits is r^n – N."}, {"question": "Which of the following is true about (r-1)’s complement?", "options": ["It is calculated as (r^n - 1) - N", "It is used for addition only", "It is always greater than the number", "More than one of the above", "None of the above"], "answer": "a", "explanation": "The (r-1)’s complement is (r^n – 1) – N."}, {"question": "If base r = 8, what are the radix and diminished radix complements?", "options": ["8’s and 7’s complement", "7’s and 6’s complement", "9’s and 8’s complement", "More than one of the above", "None of the above"], "answer": "a", "explanation": "For base 8, the radix complement is 8’s and the diminished radix complement is 7’s."}, {"question": "What is the 10’s complement of 435?", "options": ["564", "565", "566", "More than one of the above", "None of the above"], "answer": "b", "explanation": "10’s complement = (999 – 435) + 1 = 565."}, {"question": "What is the 2’s complement of binary 0101?", "options": ["1010", "1101", "1011", "More than one of the above", "None of the above"], "answer": "c", "explanation": "1’s complement of 0101 is 1010; adding 1 gives 1011."}, {"question": "Which of the following is used for subtraction using complements?", "options": ["Subtract directly", "Add complement of subtrahend to minuend", "Divide both numbers", "More than one of the above", "None of the above"], "answer": "b", "explanation": "Subtraction can be done by adding the complement of the subtrahend to the minuend."}, {"question": "If there's no carry in result using r’s complement subtraction, then the result is:", "options": ["Positive", "Zero", "Negative", "More than one of the above", "None of the above"], "answer": "c", "explanation": "Absence of carry in r’s complement subtraction means the result is negative."}, {"question": "The radix of hexadecimal number system is:", "options": ["2", "8", "16", "More than one of the above", "None of the above"], "answer": "c", "explanation": "Hexadecimal system uses base 16."}, {"question": "How is 1's complement obtained for binary numbers?", "options": ["Flip all bits", "Add 1 to the number", "Subtract from 1", "More than one of the above", "None of the above"], "answer": "a", "explanation": "1’s complement is obtained by flipping every bit."}, {"question": "What is the main purpose of using complements in arithmetic operations?", "options": ["Speed up multiplication", "Avoid decimal point", "Simplify subtraction", "More than one of the above", "None of the above"], "answer": "c", "explanation": "Complements allow subtraction to be performed using addition."}, {"question": "In base r = 5, what are the possible t is also known as the diminished radix complement?", "options": ["r’s complement", "(r+1)’s complement", "(r-1)’s complement", "2’s complement only", "None of the above"], "answer": "c", "explanation": "The diminished radix complement is the (r-1)’s complement."}, {"question": "When using r’s complement for subtraction, what kind of operation is performed?", "options": ["Division", "Multiplication", "Addition", "Bitwise AND", "None of the above"], "answer": "c", "explanation": "Subtraction is performed by adding the complement of the subtrahend."}, {"question": "Which of the following is NOT an advantage of using r’s complement?", "options": ["Simplifies hardware design", "Automatically gives correct sign of result", "Negative zeros are eliminated", "Requires special subtraction hardware", "Uses addition circuitry for subtraction"], "answer": "d", "explanation": "r’s complement avoids the need for special subtraction hardware."}, {"question": "Why is the elimination of negative zero important in number representation?", "options": ["It simplifies arithmetic operations", "It increases storage requirements", "It creates ambiguous results", "It slows down processing", "None of the above"], "answer": "a", "explanation": "A single zero representation avoids ambiguity and simplifies logic."}, {"question": "In the r’s complement system, which of the following steps is unnecessary?", "options": ["Comparing minuend and subtrahend before subtraction", "Adding the complement of the subtrahend", "Using addition circuitry", "Converting numbers to base r", "None of the above"], "answer": "a", "explanation": "The complement method handles the sign, so prior comparison is unnecessary."}, {"question": "What is the main practical benefit of using r’s complement in computer arithmetic?", "options": ["Faster division", "Easier multiplication", "Simplifies subtraction using addition", "Allows floating-point arithmetic", "None of the above"], "answer": "c", "explanation": "It allows sub
