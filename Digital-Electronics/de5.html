
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Excess-3 Code MCQ Practice</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    margin:0;
    color:#1f2937;
}

.wrap{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:#fff;
    padding:24px;
    border-radius:14px;
    box-shadow:0 2px 10px #0001;
    margin-bottom:16px;
}

.option{
    display:block;
    width:100%;
    text-align:left;
    padding:14px;
    margin:10px 0;
    background:white;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:16px;
    cursor:pointer;
}

.selected{
    border:2px solid #2563eb;
    background:#eff6ff;
}

button{
    padding:11px 16px;
    border:0;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    margin:4px;
}

.primary{
    background:#2563eb;
    color:white;
}

.secondary{
    background:#e5e7eb;
}

.hidden{
    display:none;
}

.top{
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
}

.correct{
    background:#dcfce7;
    border-color:#16a34a;
}

.wrong{
    background:#fee2e2;
    border-color:#dc2626;
}

.explain{
    margin-top:14px;
    padding:14px;
    background:#f8fafc;
    border-radius:8px;
    line-height:1.5;
}

#palette button{
    min-width:42px;
}

.done{
    background:#bbf7d0;
}

</style>

</head>

<body>

<div class="wrap">

<div id="quiz">

<div class="card top">

<b id="progress"></b>

<b>Topic: Excess-3 Code</b>

</div>


<div class="card">

<h2 id="question"></h2>

<div id="options"></div>

<div id="explanation" class="hidden explain"></div>

</div>


<div class="card top">

<div>

<button class="secondary" onclick="prev()">Previous</button>

<button class="primary" onclick="next()">Next</button>

</div>

<button onclick="finish()">Submit Test</button>

</div>


<div id="palette" class="card"></div>

</div>


<div id="result" class="card hidden">

<h1>🎯 Result</h1>

<h2 id="score"></h2>

<p id="stats"></p>

<button class="primary" onclick="review()">
Review Answers & Explanations
</button>

<button class="secondary" onclick="location.reload()">
Try Again
</button>

</div>

</div>


<script>

],

options:[

},

answer:"a",

explanation:"According to the given MCQ, more than one statement is considered true."

},

question:"Why is Excess-3 considered more reliable in transmission?",
options:[
"Because it avoids 0000 and 1111",

],
answer:"a",
explanation:"According to the given MCQ, Excess-3 avoids the extreme binary codes 0000 and 1111."
},

{
id:28,
question:"What makes Excess-3 arithmetic easier?",
options:[

},

{
id:29,
question:"In Excess-3, what is the binary code for decimal 5?",
options:[

],
answer:"a",

},

{
id:30,
question:"Which property helps Excess-3 code in subtraction operations?",
options:[
"It is self-complementary",
"It uses Gray code",

],
answer:"a",
explanation:"The self-complementary property allows easy handling of 9's complements in subtraction."
}

];


let idx = 0;
let ans = {};
let reviewMode = false;


function render(){

let q = qs[idx];

document.getElementById("progress").textContent =
`Question ${idx+1} of ${qs.length}`;


document.getElementById("question").textContent =
q.question;


let box = document.getElementById("options");

box.innerHTML = "";


q.options.forEach((o,i)=>{

let l = "abcde"[i];

let b = document.createElement("button");

b.className =
"option" + (ans[q.id] === l ? " selected" : "");

b.textContent =
l.toUpperCase() + ") " + o;


if(reviewMode){

b.disabled = true;

if(l === q.answer){

b.classList.add("correct");

}

if(ans[q.id] === l && l !== q.answer){

b.classList.add("wrong");

}

}

else{

b.onclick = ()=>{

ans[q.id] = l;

render();

};

}


box.appendChild(b);

});


let ex = document.getElementById("explanation");


if(reviewMode){

ex.classList.remove("hidden");

ex.innerHTML =
"<b>Correct Answer: " +
q.answer.toUpperCase() +
") " +
q.options["abcde".indexOf(q.answer)] +
"</b><br><br><b>Explanation:</b> " +
q.explanation;

}

else{

ex.classList.add("hidden");

}


let p = document.getElementById("palette");

p.innerHTML =
"<b>Question Palette</b><br>";


qs.forEach((x,i)=>{

let b =
document.createElement("button");

b.textContent = i + 1;


if(ans[x.id]){

b.classList.add("done");

}


b.onclick = ()=>{

idx = i;

render();

};


p.appendChild(b);

});

}


function prev(){

if(idx > 0){

idx--;

render();

}

}


function next(){

if(idx < qs.length - 1){

idx++;

render();

}

}


function finish(){

if(!confirm("Submit your test?")) return;


document.getElementById("quiz")
.classList.add("hidden");


document.getElementById("result")
.classList.remove("hidden");


let correct =
qs.filter(q => ans[q.id] === q.answer).length;


let attempted =
Object.keys(ans).length;


document.getElementById("score")
.textContent =
`Score: ${correct} / ${qs.length}`;


document.getElementById("stats")
.textContent =
`Attempted: ${attempted} | Correct: ${correct} | Wrong: ${attempted-correct} | Unattempted: ${qs.length-attempted}`;

}


function review(){

reviewMode = true;


document.getElementById("result")
.classList.add("hidden");


document.getElementById("quiz")
.classList.remove("hidden");


idx = 0;

render();

}


render();

</script>

</body>
</html>
