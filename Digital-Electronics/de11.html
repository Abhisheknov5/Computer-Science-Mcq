 of the following statements about 9's complement subtraction is true?", "options": ["It simplifies subtraction operations", "It avoids the direct subtraction of numbers", "It always generates a carry", "More than one of the above", "None of the above"], "answer": "d", "explanation": "More than one of the above Explanation: It simplifies subtraction and avoids direct subtraction by turning it into addition."}, {"id": 11, "question": "The 9's complement of the number 5678 is:", "options": ["4321", "4320", "4322", "More than one of the above", "None of the above"], "answer": "a", "explanation": "4321 Explanation: Subtract each digit from 9: 9-5=4, 9-6=3, 9-7=2, 9-8=1 4321"}, {"id": 12, "question": "To find the 9's complement of a number with n digits, subtract the number from:", "options": ["10^n - 1", "10^n", "9^n", "More than one of the above", "None of the above"], "answer": "a", "explanation": "10n - 1 Explanation: For a 4-digit number, it’s 9999 (which is 104 - 1)"}, {"id": 13, "question": "Why is 9's complement useful in subtraction?", "options": ["It converts subtraction into addition", "It speeds up multiplication", "It helps in division", "More than one of the above", "None of the above"], "answer": "a", "explanation": "It converts subtraction into addition Explanation: That's the whole purpose of using complements: avoid direct subtraction."}, {"id": 14, "question": "If the minuend is 5423 and the subtrahend is 1234, which case applies?", "options": ["Case 1 - subtrahend < minuend", "Case 2 - subtrahend > minuend", "Case 1 - subtrahend = minuend", "More than one of the above", "None of the above"], "answer": "a", "explanation": "Case 1 - subtrahend < minuend Explanation: Since 1234 < 5423, it’s Case 1."}, {"id": 15, "question": "What is the 9's complement of 0000?", "options": ["9999", "0000", "1111", "More than one of the above", "None of the above"], "answer": "a", "explanation": "9999 Explanation: 9 - 0 = 9 for each digit 9999"}, {"id": 16, "question": "S ment of a number related to its 9's complement?", "options": ["Add 1 to the 9's complement", "Subtract 1 from the 9's complement", "Multiply the 9's complement by 10", "More than one of the above", "None of the above"], "answer": "a", "explanation": "Add 1 to the 9's complement 10's complement = 9's complement + 1."}, {"id": 34, "question": "What is the purpose of using 10's complement in arithmetic?", "options": ["To perform multiplication", "To perform subtraction", "To perform division", "More than one of the above", "None of the above"], "answer": "b", "explanation": "To perform subtraction It simplifies subtraction using addition logic."}, {"id": 35, "question": "What is the first step in subtraction using 10's complement?", "options": ["Find the 9's complement of the minuend", "Find the 10's complement of the minuend", "Find the 10's complement of the subtrahend", "More than one of the above", "None of the above"], "answer": "c", "explanation": "Find the 10's complement of the subtrahend You take the complement of the number to be subtracted."}, {"id": 36, "question": "In subtraction using 10's complement, what do you do after finding the 10's complement of the subtrahend?", "options": ["Subtract it from the minuend", "Add it to the minuend", "Multiply it by 10", "More than one of the above", "None of the above"], "answer": "b", "explanation": "Add it to the minuend Add the complement to the original number."}, {"id": 37, "question": "When the subtrahend is smaller than the minuend and subtraction is done using 10's complement, what is the result?", "options": ["Negative without carry", "Positive with carry", "Always zero", "More than one of the above", "None of the above"], "answer": "b", "explanation": "Positive with carry Carry indicates positive result, just ignore it."}, {"id": 38, "question": "What do you do with the carry in Case 1 (subtrahend < minuend) using 10's complement?", "options": ["Add it to the result", "Ignore it", "Subtract it", "More than plement adds an extra 1 That is the only difference: 10’s complement = 9’s complement + 1."}, {"id": 50, "question": "What is the 10’s complement of 6789?", "options": ["3210", "3211", "3212", "More than one of the above", "None of the above"], "answer": "b", "explanation": "3211 9999 - 6789 = 3210 + 1 = 3211."}, {"id": 51, "question": "What is 10’s complement of 1000?", "options": ["9000", "8999", "9001", "More than one of the above", "None of the above"], "answer": "c", "explanation": "9000 9999 - 1000 = 8999 + 1 = 9000."}, {"id": 52, "question": "Which of the following is a valid step in 10’s complement subtraction?", "options": ["Ignore carry in Case 1", "Subtract 10’s complement in Case 2", "Always subtract carry", "More than one of the above", "None of the above"], "answer": "a", "explanation": "Ignore carry in Case 1 That’s the standard method in Case 1 (positive result)."}, {"id": 53, "question": "If 10’s complement of 3456 is added to 1234 and result has no carry, final result is:", "options": ["Positive", "Negative", "Zero", "More than one of the above", "None of the above"], "answer": "b", "explanation": "Negative No carry = Negative result."}, {"id": 54, "question": "10’s complement of 8000 is:", "options": ["1999", "1998", "2000", "More than one of the above", "None of the above"], "answer": "c", "explanation": "2000 9999 - 8000 = 1999 + 1 = 2000."}, {"id": 55, "question": "In 10’s complement subtraction, which number is complemented?", "options": ["Minuend", "Subtrahend", "Result", "More than one of the above", "None of the above"], "answer": "b", "explanation": "Subtrahend Only the number to be subtracted is complemented."}, {"id": 56, "question": "In Case 1, what does ignoring the carry result in?", "options": ["Correct positive result", "Incorrect negative result", "Zero", "More than one of the above", "None of the above"], "answer": "a", "explanation": "Correct positive result That’s the intended logic of Case 1."}, {"id": 57, "question": "Why is 10's complement preferred over 9’s complement in computers?", "options": ["Easier for binary systems", "Avoids two-step correction", "Simpler hardware implementation", "More than one of the above", "None of the above"], "answer": "d", "explanation": "More than one of the above It’s easier for binary and better for hardware."}, {"id": 58, "question": "The 10’s complement of a 4-digit number 0001 is:", "options": ["9998", "9999", "9990", "More than one of the above", "None of the above"], "answer": "a", "explanation": "9998 9999 - 0001 = 9998 + 1 = 9999."}, {"id": 59, "question": "How do you subtract a larger number from a smaller one using 10’s complement?", "options": ["Find 10’s complement of smaller number", "Subtract directly", "Find 10’s complement of larger number and add to smaller", "More than one of the above", "None of the above"], "answer": "c", "explanation": "Find 10’s complement of larger number and add to smaller Standard method for Case 2 (minuend < subtrahend)."}, {"id": 60, "question": "10’s complement is also known as:", "options": ["Radix complement", "Diminished radix complement", "Signed magnitude", "More than one of the above", "None of the above"], "answer": "a", "explanation": "Radix complement In decimal (base 10), 10’s complement is radix complement; 9’s is diminished radix complement."}]};
let qs=[],idx=0,answers={},reviewMode=false;

function showPage(id){
  ['home','quiz','result'].forEach(x=>document.getElementById(x).classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function startTopic(name){
  qs=topics[name];
  idx=0;
  answers={};
  reviewMode=false;
  document.getElementById('topicTitle').textContent=name;
  showPage('quiz');
  render();
}

function render(){
  const q=qs[idx];
  document.getElementById('progress').textContent='Question '+(idx+1)+' of '+qs.length;
  document.getElementById('question').textContent=q.question;

  const box=document.getElementById('options');
  box.innerHTML='';

  q.options.forEach((opt,i)=>{
    if(!opt)return;
    const letter='abcde'[i];
    const btn=document.createElement('button');
    btn.className='option';
    btn.textContent=letter.toUpperCase()+') '+opt;

    if(answers[q.id]===letter)btn.classList.add('selected');

    if(reviewMode){
      btn.disabled=true;
      if(letter===q.answer)btn.classList.add('correct');
      if(answers[q.id]===letter && letter!==q.answer)btn.classList.add('wrong');
    } else {
      btn.onclick=()=>{answers[q.id]=letter;render()};
    }

    box.appendChild(btn);
  });

  const ex=document.getElementById('explanation');
  if(reviewMode){
    ex.classList.remove('hidden');
    const ai='abcde'.indexOf(q.answer);
    ex.innerHTML='<b>Correct Answer: '+q.answer.toUpperCase()+') '+q.options[ai]+'</b><br><br><b>Explanation:</b> '+q.explanation;
  } else {
    ex.classList.add('hidden');
  }

  const pal=document.getElementById('palette');
  pal.innerHTML='<b>Question Palette</b><br>';

  qs.forEach((item,i)=>{
    const b=document.createElement('button');
    b.textContent=i+1;
    if(answers[item.id])b.classList.add('done');
    b.onclick=()=>{idx=i;render()};
    pal.appendChild(b);
  });
}

function prevQ(){if(idx>0){idx--;render()}}
function nextQ(){if(idx<qs.length-1){idx++;render()}}

function finish(){
  const attempted=Object.keys(answers).length;
  const correct=qs.filter(q=>answers[q.id]===q.answer).length;

  document.getElementById('score').textContent='Score: '+correct+' / '+qs.length;
  document.getElementById('stats').textContent=
    'Attempted: '+attempted+
    ' | Correct: '+correct+
    ' | Wrong: '+(attempted-correct)+
    ' | Unattempted: '+(qs.length-attempted);

  showPage('result');
}

function review(){
  reviewMode=true;
  idx=0;
  showPage('quiz');
  render();
}

function restart(){
  answers={};
  idx=0;
  reviewMode=false;
  showPage('quiz');
  render();
}

function goHome(){
  showPage('home');
}
</script>
